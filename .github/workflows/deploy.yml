name: Deploy VitePress site to Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate solid-state math (KaTeX and MathJax)
        run: |
          npm run check:katex -- docs/solid-state
          npm run check:mathjax -- docs/solid-state

      - name: Validate URL question selection
        run: npm run check:selection

      - name: Build with VitePress
        run: npm run docs:build
        env:
          VITE_CANDIDATE_INDEX_ORIGIN: ${{ vars.VITE_CANDIDATE_INDEX_ORIGIN || 'https://learningpages-candidate-index.hekote9.workers.dev' }}

      - name: Validate agent prompt page
        run: npm run check:agent-prompt

      - name: Validate published TSV index
        run: npm run check:public-index

      - name: Publish and validate all static question readers
        run: npm run check:exam-render

      - name: Validate subject homepage links
        run: npm run check:subject-routes

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
