<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .wire { stroke: #2c3e50; stroke-width: 3; fill: none; }
    .node { fill: #2c3e50; }
    .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
    .sub { font-family: sans-serif; font-size: 12px; fill: #7f8c8d; }
    .box { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; rx: 6px; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" class="label" font-size="20">Alexander &amp; Sadiku Problem 1.18 (Fig. 1.29)</text>
  <text x="300" y="55" text-anchor="middle" class="sub">Power Conservation &amp; Passive Sign Convention Analysis</text>
  <rect x="150" y="100" width="300" height="220" class="box"/>
  <text x="300" y="140" text-anchor="middle" class="label">30V Source: p1 = 30(-10) = -300 W (Supplying)</text>
  <text x="300" y="180" text-anchor="middle" class="label">10V Element: p2 = 10(10) = 100 W (Absorbing)</text>
  <text x="300" y="220" text-anchor="middle" class="label">20V Element: p3 = 20(14) = 280 W (Absorbing)</text>
  <text x="300" y="260" text-anchor="middle" class="label">8V Element: p4 = 8(-4) = -32 W (Supplying)</text>
  <text x="300" y="300" text-anchor="middle" class="label">12V Element: p5 = 12(-4) = -48 W (Supplying)</text>
  <text x="300" y="370" text-anchor="middle" class="sub">&#x2211; p = -300 + 100 + 280 - 32 - 48 = 0 W (Conservation Verified)</text>
</svg>