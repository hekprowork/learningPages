<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .res-label { font-family: 'Times New Roman', serif; font-size: 15px; font-weight: 700; font-style: italic; }
      .wire-main { stroke: #334155; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-delta-box { stroke: #d97706; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-wye-box { stroke: #0284c7; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node-dot { fill: #0f172a; stroke: #ffffff; stroke-width: 1.5; }
      .node-neutral { fill: #0284c7; stroke: #ffffff; stroke-width: 1.5; }
      .badge { fill: #e0f2fe; stroke: #38bdf8; stroke-width: 1; rx: 4px; }
      .badge-text { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
    </style>
  </defs>

  <!-- Step 1: Original Bridge Circuit -->
  <rect x="15" y="15" width="280" height="370" class="card" />
  <text x="155" y="45" class="title">步驟 1：識別非平衡電橋</text>
  <text x="155" y="68" class="subtitle">圈出上方 Δ 網孔 (a-b-c)</text>

  <!-- Leads -->
  <line x1="155" y1="90" x2="155" y2="120" class="wire-main" />
  <line x1="155" y1="270" x2="155" y2="305" class="wire-main" />
  
  <!-- Highlight box around top delta -->
  <polygon points="155,108 69,203 241,203" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  
  <!-- Resistors -->
  <polyline points="155.0,120.0 146.8,128.8 137.2,128.8 138.5,147.9 119.4,147.9 120.6,167.1 101.5,167.1 102.8,186.2 93.2,186.2 85.0,195.0" class="wire-delta-box" />
  <polyline points="155.0,120.0 163.2,128.8 162.5,138.3 181.7,138.4 180.4,157.5 199.6,157.5 198.3,176.6 217.5,176.7 216.8,186.2 225.0,195.0" class="wire-delta-box" />
  <polyline points="85.0,195.0 100.0,195.0 109.2,202.0 127.5,188.0 145.8,202.0 164.2,188.0 182.5,202.0 200.8,188.0 210.0,195.0 225.0,195.0" class="wire-delta-box" />
  <polyline points="85.0,195.0 93.2,203.8 92.5,213.3 111.7,213.4 110.4,232.5 129.6,232.5 128.3,251.6 147.5,251.7 146.8,261.2 155.0,270.0" class="wire-main" />
  <polyline points="225.0,195.0 216.8,203.8 207.2,203.8 208.5,222.9 189.4,222.9 190.6,242.1 171.5,242.1 172.8,261.2 163.2,261.2 155.0,270.0" class="wire-main" />
  
  <!-- Nodes -->
  <circle cx="155" cy="120" r="4" class="node-dot" />
  <circle cx="85" cy="195" r="4" class="node-dot" />
  <circle cx="225" cy="195" r="4" class="node-dot" />
  <circle cx="155" cy="270" r="4" class="node-dot" />
  
  <text x="145" y="120" class="node-text" text-anchor="end">a</text>
  <text x="75" y="199" class="node-text" text-anchor="end">b</text>
  <text x="235" y="199" class="node-text" text-anchor="start">c</text>
  <text x="165" y="274" class="node-text" text-anchor="start">d</text>
  
  <text x="105" y="145" class="res-label" fill="#d97706">R_c</text>
  <text x="205" y="145" class="res-label" fill="#d97706">R_b</text>
  <text x="155" y="185" class="res-label" fill="#d97706" text-anchor="middle">R_a</text>
  <text x="105" y="250" class="res-label" fill="#334155">R₄</text>
  <text x="205" y="250" class="res-label" fill="#334155">R₅</text>
  
  <text x="155" y="345" class="subtitle" font-weight="600" fill="#d97706">上方網孔既非串聯亦非並聯</text>
  <text x="155" y="365" class="subtitle">鎖定上方三角形進行 Δ→Y 轉換</text>

  <!-- Step 2: Delta to Wye Replacement -->
  <rect x="320" y="15" width="280" height="370" class="card" />
  <text x="460" y="45" class="title">步驟 2：局部轉為星形 Y</text>
  <text x="460" y="68" class="subtitle">引入中性點 n，消除中間跨接</text>

  <!-- Leads -->
  <line x1="460" y1="90" x2="460" y2="120" class="wire-main" />
  <line x1="460" y1="270" x2="460" y2="305" class="wire-main" />
  
  <!-- Highlight box around Wye -->
  <polygon points="460,112 378,199 542,199" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  
  <!-- Wye Resistors -->
  <polyline points="460.0,120.0 460.0,128.0 454.0,130.0 466.0,134.0 454.0,138.0 466.0,142.0 454.0,146.0 466.0,150.0 460.0,152.0 460.0,160.0" class="wire-wye-box" />
  <polyline points="390.0,195.0 398.9,190.5 406.0,193.7 409.3,178.6 423.3,185.0 426.7,170.0 440.7,176.4 444.0,161.3 451.1,164.5 460.0,160.0" class="wire-wye-box" />
  <polyline points="530.0,195.0 521.1,190.5 519.4,183.0 505.3,189.4 502.0,174.3 488.0,180.7 484.7,165.6 470.6,172.0 468.9,164.5 460.0,160.0" class="wire-wye-box" />
  
  <!-- Lower Resistors -->
  <polyline points="390.0,195.0 398.2,203.8 397.5,213.3 416.7,213.4 415.4,232.5 434.6,232.5 433.3,251.6 452.5,251.7 451.8,261.2 460.0,270.0" class="wire-main" />
  <polyline points="530.0,195.0 521.8,203.8 512.2,203.8 513.5,222.9 494.4,222.9 495.6,242.1 476.5,242.1 477.8,261.2 468.2,261.2 460.0,270.0" class="wire-main" />
  
  <!-- Nodes -->
  <circle cx="460" cy="120" r="4" class="node-dot" />
  <circle cx="390" cy="195" r="4" class="node-dot" />
  <circle cx="530" cy="195" r="4" class="node-dot" />
  <circle cx="460" cy="270" r="4" class="node-dot" />
  <circle cx="460" cy="160" r="4" class="node-neutral" />
  
  <text x="450" y="120" class="node-text" text-anchor="end">a</text>
  <text x="380" y="199" class="node-text" text-anchor="end">b</text>
  <text x="540" y="199" class="node-text" text-anchor="start">c</text>
  <text x="470" y="274" class="node-text" text-anchor="start">d</text>
  <text x="470" y="164" class="node-text" fill="#0284c7" font-size="12">n</text>
  
  <text x="475" y="145" class="res-label" fill="#0284c7">R₁</text>
  <text x="415" y="175" class="res-label" fill="#0284c7">R₂</text>
  <text x="500" y="175" class="res-label" fill="#0284c7">R₃</text>
  <text x="410" y="250" class="res-label" fill="#334155">R₄</text>
  <text x="510" y="250" class="res-label" fill="#334155">R₅</text>
  
  <text x="460" y="345" class="subtitle" font-weight="600" fill="#0284c7">中間跨接 R_a 被徹底消除</text>
  <text x="460" y="365" class="subtitle">從節點 n 分裂出兩條獨立串聯路徑</text>

  <!-- Step 3: Series-Parallel Equivalent -->
  <rect x="625" y="15" width="280" height="370" class="card" />
  <text x="765" y="45" class="title">步驟 3：串並聯秒殺總阻抗</text>
  <text x="765" y="68" class="subtitle">兩組串聯再並聯，最後加上頂部 R₁</text>

  <!-- Leads and Wires -->
  <line x1="765" y1="90" x2="765" y2="110" class="wire-main" />
  <line x1="765" y1="255" x2="765" y2="290" class="wire-main" />
  
  <line x1="765" y1="160" x2="710" y2="160" class="wire-main" />
  <line x1="765" y1="160" x2="820" y2="160" class="wire-main" />
  <line x1="710" y1="255" x2="765" y2="255" class="wire-main" />
  <line x1="820" y1="255" x2="765" y2="255" class="wire-main" />
  
  <!-- Resistors -->
  <polyline points="765.0,110.0 765.0,120.0 758.0,122.5 772.0,127.5 758.0,132.5 772.0,137.5 758.0,142.5 772.0,147.5 765.0,150.0 765.0,160.0" class="wire-wye-box" />
  <polyline points="710.0,160.0 710.0,175.0 702.0,179.1 718.0,187.2 702.0,195.3 718.0,203.4 702.0,211.6 718.0,219.7 702.0,227.8 718.0,235.9 710.0,240.0 710.0,255.0" class="wire-main" />
  <polyline points="820.0,160.0 820.0,175.0 812.0,179.1 828.0,187.2 812.0,195.3 828.0,203.4 812.0,211.6 828.0,219.7 812.0,227.8 828.0,235.9 820.0,240.0 820.0,255.0" class="wire-main" />
  
  <!-- Nodes -->
  <circle cx="765" cy="110" r="4" class="node-dot" />
  <circle cx="765" cy="160" r="4" class="node-neutral" />
  <circle cx="765" cy="255" r="4" class="node-dot" />
  
  <text x="755" y="114" class="node-text" text-anchor="end">a</text>
  <text x="775" y="154" class="node-text" fill="#0284c7" font-size="12">n</text>
  <text x="775" y="259" class="node-text" text-anchor="start">d</text>
  
  <text x="785" y="135" class="res-label" fill="#0284c7">R₁</text>
  <text x="695" y="210" class="res-label" fill="#334155" text-anchor="end">R₂ + R₄</text>
  <text x="835" y="210" class="res-label" fill="#334155" text-anchor="start">R₃ + R₅</text>
  
  <!-- Formula Card -->
  <rect x="640" y="315" width="250" height="48" class="badge" />
  <text x="765" y="335" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">
    R_eq = R₁ + [(R₂ + R₄) ∥ (R₃ + R₅)]
  </text>
  <text x="765" y="352" class="subtitle" font-size="11" fill="#0369a1">標準串聯並聯解析式</text>
</svg>
