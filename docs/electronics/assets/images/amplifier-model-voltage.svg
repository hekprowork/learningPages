      .thin{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .label{fill:#111;font:20px Arial,sans-serif}
      .small{fill:#111;font:17px Arial,sans-serif}
      .port{fill:#fff;stroke:#111;stroke-width:3}
    </style>
  </defs>
  <rect width="760" height="330" fill="#fff"/>
