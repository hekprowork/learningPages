  <path class="wire" d="M434 129V105H505"/>
  <path class="wire" d="M505 105l10-10 10 20 10-20 10 20 10-20 10 20 10-10H678"/>
  <path class="thin" d="M434 148v12M428 154h12M434 181v12"/>
  <path class="thin" d="M160 132v24M154 144h12M154 174h12"/>
