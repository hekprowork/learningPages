<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Voltage amplifier two-port model</title>
  <desc id="desc">Input resistance Ri and a voltage-controlled voltage source Avo vi in series with output resistance Ro.</desc>
