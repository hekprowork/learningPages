  <text class="small" x="458" y="168">A<tspan baseline-shift="sub" font-size="70%">vo</tspan> · v<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text class="small" x="546" y="84">R<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
