      .wire{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .label{fill:#111;font:20px Arial,sans-serif}
      .small{fill:#111;font:17px Arial,sans-serif}
      .port{fill:#fff;stroke:#111;stroke-width:3}
    </style>
  </defs>
  <rect width="760" height="330" fill="#fff"/>
  <text class="label" x="32" y="34">Transconductance amplifier (VCCS)</text>
  <circle class="port" cx="82" cy="105" r="6"/><circle class="port" cx="82" cy="225" r="6"/>
  <circle class="port" cx="678" cy="105" r="6"/><circle class="port" cx="678" cy="225" r="6"/>
  <path class="wire" d="M88 105H184M88 225H678"/>
  <path class="wire" d="M184 105V120l10 10 10-20 10 20 10-20 10 20 10-10v105"/>
  <path class="wire" d="M456 225V205l-30-38 30-38 30 38-30 38Z"/>
  <path class="wire" d="M456 129V105H678M456 205V225"/>
  <path class="wire" d="M578 105V120l10 10 10-20 10 20 10-20 10 20 10-10v105"/>
  <path class="thin" d="M456 190v-42M448 156l8-8 8 8"/>
  <path class="thin" d="M160 132v24M154 144h12M154 174h12"/>
  <path class="thin" d="M625 105h32M649 99l8 6-8 6"/>
  <path class="thin" d="M700 132v24M694 144h12M694 186h12"/>
  <path class="thin" d="M360 225v18m-16 0h32m-26 6h20m-14 6h8"/>
