<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Transconductance amplifier two-port model</title>
  <desc id="desc">Input voltage vi controls a current source Gm vi in parallel with output resistance Ro.</desc>
  <defs>
