  <text class="small" x="488" y="168">G<tspan baseline-shift="sub" font-size="70%">m</tspan> · v<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text class="small" x="620" y="166">R<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
