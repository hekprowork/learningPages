<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%" role="img" aria-labelledby="title-2-11 desc-2-11">
  <title id="title-2-11">Figure 2.11 A Weighted Summer with Signs of Both Polarities</title>
  <desc id="desc-2-11">A weighted summer operational amplifier circuit capable of implementing summing coefficients of both positive and negative signs using two cascaded inverting stages.</desc>

  <style>
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Stage 1 Inputs: v1 and v2 -->
  <circle class="term" cx="105" cy="125" r="4.5"/>
  <text class="math" x="80" y="131">v<tspan class="sub">1</tspan></text>
  <line class="wire" x1="110" y1="125" x2="145" y2="125"/>
  <path class="wire" d="M 145.0,125.0 L 153.0,125.0 L 159.7,116.5 L 166.3,133.5 L 173.0,116.5 L 179.7,133.5 L 186.3,116.5 L 193.0,125.0 L 201.0,125.0"/>
  <line class="wire" x1="201" y1="125" x2="230" y2="125"/>
  <text class="math" x="165" y="105">R<tspan class="sub-norm">1</tspan></text>

  <circle class="term" cx="105" cy="185" r="4.5"/>
  <text class="math" x="80" y="191">v<tspan class="sub">2</tspan></text>
  <line class="wire" x1="110" y1="185" x2="145" y2="185"/>
  <path class="wire" d="M 145.0,185.0 L 153.0,185.0 L 159.7,176.5 L 166.3,193.5 L 173.0,176.5 L 179.7,193.5 L 186.3,176.5 L 193.0,185.0 L 201.0,185.0"/>
  <line class="wire" x1="201" y1="185" x2="214" y2="185"/>
  <line class="wire" x1="214" y1="185" x2="230" y2="125"/>
  <text class="math" x="165" y="168">R<tspan class="sub-norm">2</tspan></text>

  <!-- Op-Amp 1 inverting junction -->
  <circle class="junc" cx="230" cy="125" r="3.5"/>
  <line class="wire" x1="230" y1="125" x2="260" y2="125"/>

  <!-- Feedback Resistor Ra -->
  <path class="wire" d="M 230 125 L 230 60 L 280 60"/>
  <path class="wire" d="M 280.0,60.0 L 288.0,60.0 L 294.7,51.5 L 301.3,68.5 L 308.0,51.5 L 314.7,68.5 L 321.3,51.5 L 328.0,60.0 L 336.0,60.0"/>
  <path class="wire" d="M 336 60 L 375 60 L 375 145"/>
  <text class="math" x="300" y="44">R<tspan class="sub">a</tspan></text>

  <!-- Op-Amp 1 Body -->
  <polygon points="260,98 345,145 260,192" class="opamp-body"/>
  <text class="opamp-sign" x="273" y="125">−</text>
  <text class="opamp-sign" x="273" y="165">+</text>

  <!-- Op-Amp 1 Non-inverting input ground -->
  <path class="wire" d="M 260 165 L 230 165 L 230 235"/>
  <line class="wire" x1="230" y1="235" x2="230" y2="245"/>
  <line class="wire" x1="216" y1="245" x2="244" y2="245"/>
  <line class="wire" x1="221" y1="250" x2="239" y2="250"/>
  <line class="wire" x1="226" y1="255" x2="234" y2="255"/>

  <!-- Inter-stage Output of Op-Amp 1 -->
  <line class="wire" x1="345" y1="145" x2="375" y2="145"/>
  <circle class="junc" cx="375" cy="145" r="3.5"/>
  <line class="wire" x1="375" y1="145" x2="405" y2="145"/>
  <path class="wire" d="M 405.0,145.0 L 413.0,145.0 L 419.7,136.5 L 426.3,153.5 L 433.0,136.5 L 439.7,153.5 L 446.3,136.5 L 453.0,145.0 L 461.0,145.0"/>
  <line class="wire" x1="461" y1="145" x2="505" y2="145"/>
  <text class="math" x="425" y="128">R<tspan class="sub">b</tspan></text>

  <!-- Stage 2 Direct Inputs: v3 and v4 -->
  <circle class="term" cx="365" cy="205" r="4.5"/>
  <text class="math" x="340" y="211">v<tspan class="sub">3</tspan></text>
  <line class="wire" x1="370" y1="205" x2="405" y2="205"/>
  <path class="wire" d="M 405.0,205.0 L 413.0,205.0 L 419.7,196.5 L 426.3,213.5 L 433.0,196.5 L 439.7,213.5 L 446.3,196.5 L 453.0,205.0 L 461.0,205.0"/>
  <line class="wire" x1="461" y1="205" x2="480" y2="205"/>
  <line class="wire" x1="480" y1="205" x2="505" y2="145"/>
  <text class="math" x="425" y="188">R<tspan class="sub-norm">3</tspan></text>

  <circle class="term" cx="365" cy="265" r="4.5"/>
  <text class="math" x="340" y="271">v<tspan class="sub">4</tspan></text>
  <line class="wire" x1="370" y1="265" x2="405" y2="265"/>
  <path class="wire" d="M 405.0,265.0 L 413.0,265.0 L 419.7,256.5 L 426.3,273.5 L 433.0,256.5 L 439.7,273.5 L 446.3,256.5 L 453.0,265.0 L 461.0,265.0"/>
  <line class="wire" x1="461" y1="265" x2="488" y2="265"/>
  <line class="wire" x1="488" y1="265" x2="505" y2="145"/>
  <text class="math" x="425" y="248">R<tspan class="sub-norm">4</tspan></text>

  <!-- Op-Amp 2 inverting junction -->
  <circle class="junc" cx="505" cy="145" r="3.5"/>
  <line class="wire" x1="505" y1="145" x2="535" y2="145"/>

  <!-- Feedback Resistor Rc -->
  <path class="wire" d="M 505 145 L 505 75 L 560 75"/>
  <path class="wire" d="M 560.0,75.0 L 568.0,75.0 L 574.7,66.5 L 581.3,83.5 L 588.0,66.5 L 594.7,83.5 L 601.3,66.5 L 608.0,75.0 L 616.0,75.0"/>
  <path class="wire" d="M 616 75 L 650 75 L 650 175"/>
  <text class="math" x="580" y="58">R<tspan class="sub">c</tspan></text>

  <!-- Op-Amp 2 Body -->
  <polygon points="535,118 620,165 535,212" class="opamp-body"/>
  <text class="opamp-sign" x="548" y="145">−</text>
  <text class="opamp-sign" x="548" y="185">+</text>

  <!-- Op-Amp 2 Non-inverting input ground -->
  <path class="wire" d="M 535 185 L 505 185 L 505 250"/>
  <line class="wire" x1="505" y1="250" x2="505" y2="260"/>
  <line class="wire" x1="491" y1="260" x2="519" y2="260"/>
  <line class="wire" x1="496" y1="265" x2="514" y2="265"/>
  <line class="wire" x1="501" y1="270" x2="509" y2="270"/>

  <!-- Final Output vo -->
  <line class="wire" x1="620" y1="165" x2="650" y2="165"/>
  <circle class="junc" cx="650" cy="165" r="3.5"/>
  <line class="wire" x1="650" y1="165" x2="690" y2="165"/>
  <circle class="term" cx="690" cy="165" r="4.5"/>
  <text class="math" x="704" y="171">v<tspan class="sub">O</tspan></text>
</svg>