<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <title>Figure 2.21 - Variable Gain Implementation for Instrumentation Amplifier</title>
  <desc>Figure 2.21: Implementation of 2R1 as the series combination of a fixed resistor R1f and a variable resistor R1v (100 k-Ohm potentiometer wired as a variable resistor) to limit maximum gain and provide adjustable gain.</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Left Circuit: 2R1 Resistor -->
  <!-- Upper terminal -->
  <circle cx="150" cy="45" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <line x1="150" y1="50" x2="150" y2="90" stroke="#000000" stroke-width="2" />

  <!-- Resistor zigzag (height 80, from y=90 to y=170) -->
  <!-- 2R1 label to the left -->
  <text x="135" y="136" font-family="'Times New Roman', Times, serif" font-size="22" font-style="italic" text-anchor="end">2R<tspan font-size="16" dy="5">1</tspan></text>

  <path d="M 150 90
           L 162 96.67
           L 138 110
           L 162 123.33
           L 138 136.67
           L 162 150
           L 138 163.33
           L 150 170"
        fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Lower terminal -->
  <line x1="150" y1="170" x2="150" y2="210" stroke="#000000" stroke-width="2" />
  <circle cx="150" cy="215" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="2" />

  <!-- Equivalence symbol (three horizontal bars) -->
  <line x1="205" y1="123" x2="235" y2="123" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <line x1="205" y1="130" x2="235" y2="130" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <line x1="205" y1="137" x2="235" y2="137" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Circuit: Series R1f and Potentiometer R1v -->
  <!-- Top terminal -->
  <circle cx="320" cy="30" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <line x1="320" y1="35" x2="320" y2="65" stroke="#000000" stroke-width="2" />

  <!-- Fixed Resistor R1f (height 55, from y=65 to y=120) -->
  <path d="M 320 65
           L 332 69.58
           L 308 78.75
           L 332 87.92
           L 308 97.08
           L 332 106.25
           L 308 115.42
           L 320 120"
        fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Label R1f -->
  <text x="342" y="97" font-family="'Times New Roman', Times, serif" font-size="22" font-style="italic">R<tspan font-size="16" dy="5">1f</tspan></text>

  <!-- Wire between R1f and R1v -->
  <line x1="320" y1="120" x2="320" y2="150" stroke="#000000" stroke-width="2" />

  <!-- Variable Resistor (Potentiometer) R1v body (height 55, from y=150 to y=205) -->
  <path d="M 320 150
           L 332 154.58
           L 308 163.75
           L 332 172.92
           L 308 182.08
           L 332 191.25
           L 308 200.42
           L 320 205"
        fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Bracket for R1v -->
  <path d="M 360 152 C 366 152 366 167 366 177 C 366 180 370 182 373 182 C 370 182 366 184 366 187 C 366 197 366 208 360 208"
        fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
  <text x="382" y="187" font-family="'Times New Roman', Times, serif" font-size="22" font-style="italic">R<tspan font-size="16" dy="5">1v</tspan></text>

  <!-- Potentiometer wiper tap and connection -->
  <!-- Wiper tap arrow from right pointing into resistor center (x=320, y=177) -->
  <line x1="320" y1="210" x2="348" y2="210" stroke="#000000" stroke-width="2" />
  <line x1="348" y1="210" x2="348" y2="177" stroke="#000000" stroke-width="2" />
  <line x1="348" y1="177" x2="323" y2="177" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Solder connection dot at bottom of variable resistor -->
  <circle cx="320" cy="210" r="3.5" fill="#000000" />

  <!-- Label '100 kΩ pot' on the left of potentiometer wiper loop -->
  <text x="300" y="172" font-family="'Times New Roman', Times, serif" font-size="18" text-anchor="end">100 k&#937;</text>
  <text x="300" y="194" font-family="'Times New Roman', Times, serif" font-size="18" text-anchor="end">pot</text>

  <!-- Wire down to bottom terminal -->
  <line x1="320" y1="210" x2="320" y2="250" stroke="#000000" stroke-width="2" />
  <circle cx="320" cy="255" r="4.5" fill="#ffffff" stroke="#000000" stroke-width="2" />

  <!-- Caption / Description on the right -->
  <g transform="translate(430, 150)">
    <text font-family="'Times New Roman', Times, serif" font-size="15" fill="#000000">
      <tspan font-weight="bold">Figure 2.21</tspan>
      <tspan> To make the gain of the circuit in Fig. 2.20(b) variable,</tspan>
    </text>
    <text y="22" font-family="'Times New Roman', Times, serif" font-size="15" fill="#000000">
      <tspan font-style="italic">2R</tspan><tspan font-size="11" dy="3">1</tspan><tspan font-size="15" dy="-3"> is implemented as the series combination of a fixed resistor </tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1f</tspan><tspan font-size="15" dy="-3"> and</tspan>
    </text>
    <text y="44" font-family="'Times New Roman', Times, serif" font-size="15" fill="#000000">
      <tspan>a variable resistor </tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1v</tspan><tspan font-size="15" dy="-3">. Resistor </tspan><tspan font-style="italic">R</tspan><tspan font-size="11" dy="3">1f</tspan><tspan font-size="15" dy="-3"> ensures that the maximum available</tspan>
    </text>
    <text y="66" font-family="'Times New Roman', Times, serif" font-size="15" fill="#000000">
      <tspan>gain is limited.</tspan>
    </text>
  </g>
</svg>
