<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <title>Figure 2.1 Circuit symbol for the op amp</title>
  <desc>Standard circuit schematic symbol for an operational amplifier showing inverting input terminal 1, noninverting input terminal 2, and output terminal 3.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <defs>
    <style>
      .wire { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .symbol { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .terminal { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .label { font-family: "Times New Roman", Times, "Nimbus Roman No9 L", serif; font-size: 18px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .pm { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 20px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #000000; text-anchor: middle; }
    </style>
  </defs>

  <!-- Op Amp Triangle Symbol -->
  <polygon points="140,55 260,110 140,165" class="symbol"/>

  <!-- Inverting input (Terminal 1) -->
  <line x1="80" y1="80" x2="140" y2="80" class="wire"/>
  <circle cx="80" cy="80" r="4" class="terminal"/>
  <text x="80" y="62" class="label">1</text>
  <text x="156" y="80" class="pm">−</text>

  <!-- Noninverting input (Terminal 2) -->
  <line x1="80" y1="140" x2="140" y2="140" class="wire"/>
  <circle cx="80" cy="140" r="4" class="terminal"/>
  <text x="80" y="122" class="label">2</text>
  <text x="156" y="140" class="pm">+</text>

  <!-- Output (Terminal 3) -->
  <line x1="260" y1="110" x2="320" y2="110" class="wire"/>
  <circle cx="320" cy="110" r="4" class="terminal"/>
  <text x="295" y="96" class="label">3</text>
</svg>
