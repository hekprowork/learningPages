<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="100%" height="100%" role="img" aria-labelledby="title-2-39 desc-2-39">
  <title id="title-2-39">Figure 2.39 Effect of the op-amp input bias and offset currents on the performance of the Miller integrator circuit</title>
  <desc id="desc-2-39">Schematic of the Miller integrator circuit showing the effect of input bias currents IB1 and IB2, compensation resistor R at the non-inverting terminal, offset current IOS through capacitor C, and resulting output voltage vo = -IB2*R + (IOS/C)*t.</desc>

  <style>
    .wire { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
    .term { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .junc { fill: #000000; }
    .arrow { fill: #000000; stroke: none; }
    .arrow-line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 19px; fill: #000000; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal; font-size: 18px; fill: #000000; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" class="arrow"/>
    </marker>
  </defs>

  <!-- Clean pure white background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= Inverting Input Path (Top Resistor R to Ground) ================= -->
  <!-- Ground at (130, 205) -->
  <line class="wire" x1="130" y1="155" x2="130" y2="205"/>
  <line class="wire" x1="116" y1="205" x2="144" y2="205"/>
  <line class="wire" x1="121" y1="210" x2="139" y2="210"/>
  <line class="wire" x1="126" y1="215" x2="134" y2="215"/>

  <!-- Wire from ground to Resistor R -->
  <line class="wire" x1="130" y1="155" x2="170" y2="155"/>

  <!-- Resistor R (x: 170 to 226) -->
  <path class="wire" d="M 170 155 L 176 155 L 180 146 L 188 164 L 196 146 L 204 164 L 212 146 L 220 164 L 224 155 L 228 155"/>
  <text class="math" x="199" y="140" text-anchor="middle">R</text>

  <!-- Current label and arrow above resistor R: IB2*R / R = IB2 -->
  <text class="math" x="88" y="127">I<tspan class="sub">B2</tspan>R/R = I<tspan class="sub">B2</tspan></text>
  <line class="arrow-line" x1="200" y1="123" x2="242" y2="123" marker-end="url(#arrowhead)"/>

  <!-- Wire from resistor to summing junction at (295, 155) -->
  <line class="wire" x1="228" y1="155" x2="340" y2="155"/>
  <circle class="junc" cx="295" cy="155" r="3.5"/>

  <!-- Inverting input current IB1 indicator arrow and label -->
  <text class="math" x="298" y="143">I<tspan class="sub">B1</tspan></text>
  <path class="arrow-line" d="M 307 146 L 319 153" marker-end="url(#arrowhead)"/>

  <!-- ================= Feedback Path (Capacitor C) ================= -->
  <!-- Wire up from inverting node (295, 155) to (295, 65) -->
  <line class="wire" x1="295" y1="155" x2="295" y2="65"/>

  <!-- Downward current arrow and label: (IB1 - IB2) = IOS -->
  <line class="arrow-line" x1="305" y1="95" x2="305" y2="120" marker-end="url(#arrowhead)"/>
  <text class="math" x="315" y="112"><tspan class="sign">(</tspan>I<tspan class="sub">B1</tspan> − I<tspan class="sub">B2</tspan><tspan class="sign">)</tspan> = I<tspan class="sub">OS</tspan></text>

  <!-- Wire from (295, 65) to Capacitor left plate -->
  <line class="wire" x1="295" y1="65" x2="365" y2="65"/>

  <!-- Capacitor C (Plates at x=365 and x=375) -->
  <line class="wire" x1="365" y1="50" x2="365" y2="80"/>
  <line class="wire" x1="375" y1="50" x2="375" y2="80"/>
  <text class="math" x="370" y="42" text-anchor="middle">C</text>

  <!-- Wire from Capacitor right plate to output junction (470, 65) -> (470, 190) -->
  <line class="wire" x1="375" y1="65" x2="470" y2="65"/>
  <line class="wire" x1="470" y1="65" x2="470" y2="190"/>
  <circle class="junc" cx="470" cy="190" r="3.5"/>

  <!-- ================= Non-Inverting Input Path (Bottom Resistor R) ================= -->
  <!-- Ground at (180, 295) -->
  <line class="wire" x1="180" y1="245" x2="180" y2="295"/>
  <line class="wire" x1="166" y1="295" x2="194" y2="295"/>
  <line class="wire" x1="171" y1="300" x2="189" y2="300"/>
  <line class="wire" x1="176" y1="305" x2="184" y2="305"/>

  <!-- Wire from ground to Resistor R -->
  <line class="wire" x1="180" y1="245" x2="200" y2="245"/>

  <!-- Resistor R (x: 200 to 256) -->
  <path class="wire" d="M 200 245 L 206 245 L 210 236 L 218 254 L 226 236 L 234 254 L 242 236 L 250 254 L 254 245 L 258 245"/>
  <text class="math" x="229" y="270" text-anchor="middle">R</text>

  <!-- Wire from resistor to non-inverting input terminal -->
  <path class="wire" d="M 258 245 L 285 245 L 285 225 L 340 225"/>

  <!-- Non-inverting input current IB2 indicator arrow and label -->
  <path class="arrow-line" d="M 292 250 C 302 248 308 238 316 228" marker-end="url(#arrowhead)"/>
  <text class="math" x="306" y="248">I<tspan class="sub">B2</tspan></text>

  <!-- Voltage indicator at non-inverting node: -IB2*R with curved arrow -->
  <text class="math" x="254" y="306" text-anchor="middle"><tspan class="sign">− </tspan>I<tspan class="sub">B2</tspan>R</text>
  <path class="arrow-line" d="M 268 296 C 275 285 280 270 285 252" marker-end="url(#arrowhead)"/>

  <!-- ================= Op-Amp Symbol ================= -->
  <!-- Triangle from (340, 130) to (440, 190) to (340, 250) -->
  <polygon points="340,130 440,190 340,250" class="opamp-body"/>
  <text class="opamp-sign" x="353" y="155">−</text>
  <text class="opamp-sign" x="353" y="225">+</text>

  <!-- ================= Output Terminal & Equation ================= -->
  <!-- Output wire -->
  <line class="wire" x1="440" y1="190" x2="520" y2="190"/>
  <circle class="term" cx="520" cy="190" r="4.5"/>
  <text class="math" x="532" y="190" dominant-baseline="central">v<tspan class="sub">O</tspan></text>

  <!-- Equation: vo = -IB2*R + (IOS / C)*t -->
  <g transform="translate(435, 238)">
    <text class="math" x="0" y="0">v<tspan class="sub">O</tspan> = <tspan class="sign">− </tspan>I<tspan class="sub">B2</tspan>R + </text>
    <g transform="translate(108, 0)">
      <text class="math" x="14" y="-12" text-anchor="middle">I<tspan class="sub">OS</tspan></text>
      <line class="wire" x1="0" y1="-5" x2="28" y2="-5" stroke-width="1.6"/>
      <text class="math" x="14" y="16" text-anchor="middle">C</text>
      <text class="math" x="33" y="0">t</text>
    </g>
  </g>
</svg>
