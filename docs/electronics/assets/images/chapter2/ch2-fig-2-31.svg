<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%" role="img" aria-labelledby="title-2-31 desc-2-31">
  <title id="title-2-31">Figure 2.31 Trimming Output DC Offset Voltage Using Offset-Nulling Terminals</title>
  <desc id="desc-2-31">Circuit diagram showing an op amp with a potentiometer connected between its two offset-nulling terminals, and the wiper connected to the negative supply rail V- to trim the output dc offset voltage to zero.</desc>

  <style>
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dash { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 8,6; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .sup { font-size: 0.72em; font-style: normal; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .arrow { fill: #111111; }
    .arrow-line { fill: none; stroke: #111111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-up" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <polygon points="0 8, 4 0, 8 8" class="arrow"/>
    </marker>
    <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 4 8, 8 0" class="arrow"/>
    </marker>
    <marker id="arrow-point" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow"/>
    </marker>
  </defs>

  <!-- Clean pure white background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left Inputs & "To rest of circuit" -->
  <text class="txt" x="120" y="165" text-anchor="end">To rest</text>
  <text class="txt" x="120" y="185" text-anchor="end">of circuit</text>

  <!-- Upper input (inverting): dashed line to terminal to op-amp -->
  <line class="wire-dash" x1="135" y1="160" x2="215" y2="160"/>
  <circle class="term" cx="220" cy="160" r="4.5"/>
  <line class="wire" x1="225" y1="160" x2="280" y2="160"/>

  <!-- Lower input (non-inverting): dashed line to terminal to op-amp -->
  <line class="wire-dash" x1="135" y1="220" x2="215" y2="220"/>
  <circle class="term" cx="220" cy="220" r="4.5"/>
  <line class="wire" x1="225" y1="220" x2="280" y2="220"/>

  <!-- Op-Amp Body -->
  <polygon class="opamp-body" points="280,130 280,250 380,190"/>
  <text class="opamp-sign" x="292" y="160">−</text>
  <text class="opamp-sign" x="292" y="220">+</text>

  <!-- Output terminal and dashed line -->
  <line class="wire" x1="380" y1="190" x2="435" y2="190"/>
  <circle class="term" cx="440" cy="190" r="4.5"/>
  <line class="wire-dash" x1="445" y1="190" x2="525" y2="190"/>

  <!-- Positive Supply Rail (V+) -->
  <!-- Wire from op-amp top (370, 184) up to y=60 -->
  <line class="wire" x1="370" y1="184" x2="370" y2="135"/>
  <circle class="term" cx="370" cy="130" r="4.5"/>
  <line class="wire" x1="370" y1="125" x2="370" y2="60"/>
  <polygon points="366,62 370,52 374,62" class="arrow"/>
  <text class="math" x="384" y="62">V<tspan class="sup">+</tspan></text>

  <!-- Negative Supply Rail (V-) -->
  <!-- Wire from op-amp bottom (370, 196) down to y=355 -->
  <line class="wire" x1="370" y1="196" x2="370" y2="245"/>
  <circle class="term" cx="370" cy="250" r="4.5"/>
  <line class="wire" x1="370" y1="255" x2="370" y2="355"/>
  <polygon points="366,353 370,363 374,353" class="arrow"/>
  <text class="math" x="384" y="362">V<tspan class="sup">−</tspan></text>

  <!-- Junction where wiper connects to V- rail -->
  <circle class="junc" cx="370" cy="330" r="3.5"/>

  <!-- Offset-Nulling Terminals -->
  <!-- Left nulling pin from op-amp bottom edge at x=290 -->
  <line class="wire" x1="290" y1="244" x2="290" y2="260"/>
  <circle class="term" cx="290" cy="265" r="4.5"/>

  <!-- Right nulling pin from op-amp bottom edge at x=350 -->
  <line class="wire" x1="350" y1="208" x2="350" y2="260"/>
  <circle class="term" cx="350" cy="265" r="4.5"/>

  <!-- Label and arrow pointing to offset-nulling terminals -->
  <text class="txt" x="220" y="260" text-anchor="end">Offset-nulling</text>
  <text class="txt" x="220" y="278" text-anchor="end">terminals</text>
  <line class="arrow-line" x1="226" y1="265" x2="278" y2="265" marker-end="url(#arrow-point)"/>

  <!-- Potentiometer wiring -->
  <!-- Left lead from (290, 270) down to y=285 then into resistor -->
  <path class="wire" d="M 290 270 L 290 285 L 302 285"/>

  <!-- Resistor zigzag: width 36 px (from 302 to 338) at y=285 -->
  <path class="wire" d="M 302 285 L 305 285 L 308 278 L 314 292 L 320 278 L 326 292 L 332 278 L 335 285 L 338 285"/>

  <!-- Right lead from resistor (338, 285) to (350, 285) up to (350, 270) -->
  <path class="wire" d="M 338 285 L 350 285 L 350 270"/>

  <!-- Potentiometer Wiper Arrow (pointing up at center of resistor x=320) -->
  <polygon points="316,298 320,290 324,298" class="arrow"/>
  <line class="wire" x1="320" y1="298" x2="320" y2="310"/>
  <circle class="term" cx="320" cy="315" r="4.5"/>

  <!-- Wiper wire to V- rail junction -->
  <path class="wire" d="M 320 320 L 320 330 L 370 330"/>
</svg>
