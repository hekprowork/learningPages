<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%">
  <title>Figure 2.41 Frequency response of an amplifier with a nominal gain of +10 V/V</title>
  <desc>Bode magnitude plot showing the closed-loop frequency response of an amplifier with a low-frequency gain of 20 dB (10 V/V), a 3 dB break frequency at 100 kHz, and a high-frequency asymptote falling at -20 dB/decade reaching 0 dB at 1000 kHz.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#000000"/>
    </marker>
    <marker id="arrow-sm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Solid white background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main plot area -->
  <g id="plot" transform="translate(25, 20)">

    <!-- Vertical axis label: |Vo / Vi| (dB) -->
    <g id="y-axis-label" transform="translate(140, 50)" font-family="Times New Roman, STIXGeneral, serif" font-size="20" text-anchor="middle">
      <line x1="-30" y1="-28" x2="-30" y2="12" stroke="#000000" stroke-width="1.5"/>
      <text x="-16" y="-10" font-style="italic" font-size="18">V<tspan baseline-shift="sub" font-size="12" font-style="normal">o</tspan></text>
      <line x1="-26" y1="-6" x2="-6" y2="-6" stroke="#000000" stroke-width="1.2"/>
      <text x="-16" y="10" font-style="italic" font-size="18">V<tspan baseline-shift="sub" font-size="12" font-style="normal">i</tspan></text>
      <line x1="-2" y1="-28" x2="-2" y2="12" stroke="#000000" stroke-width="1.5"/>
      <text x="25" y="-3" font-size="18" font-family="Times New Roman, STIXGeneral, serif">(dB)</text>
    </g>

    <!-- Axes -->
    <!-- Y-axis -->
    <line x1="140" y1="340" x2="140" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- X-axis -->
    <line x1="140" y1="340" x2="600" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- X-axis label: f (kHz) -->
    <text x="590" y="375" font-family="Times New Roman, STIXGeneral, serif" font-size="18" text-anchor="middle">
      <tspan font-style="italic">f</tspan> (kHz)
    </text>

    <!-- Y-axis ticks and labels -->
    <!-- 20 dB at y=130 -->
    <line x1="140" y1="130" x2="148" y2="130" stroke="#000000" stroke-width="1.5"/>
    <text x="130" y="136" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="end">20</text>

    <!-- 10 dB at y=235 -->
    <line x1="140" y1="235" x2="148" y2="235" stroke="#000000" stroke-width="1.5"/>
    <text x="130" y="241" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="end">10</text>

    <!-- X-axis ticks and labels -->
    <!-- Decades:
         10^-2 : x = 185
         10^-1 : x = 245
         1     : x = 305
         10    : x = 365
         100   : x = 425
         1000  : x = 485
         10^4  : x = 545
    -->
    <!-- 10^-2 -->
    <line x1="185" y1="340" x2="185" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="185" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">10<tspan baseline-shift="super" font-size="12">−2</tspan></text>

    <!-- 10^-1 -->
    <line x1="245" y1="340" x2="245" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="245" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">10<tspan baseline-shift="super" font-size="12">−1</tspan></text>

    <!-- 1 -->
    <line x1="305" y1="340" x2="305" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="305" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">1</text>

    <!-- 10 -->
    <line x1="365" y1="340" x2="365" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="365" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">10</text>

    <!-- 100 -->
    <line x1="425" y1="340" x2="425" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="425" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">100</text>

    <!-- 1000 -->
    <line x1="485" y1="340" x2="485" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="485" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">1000</text>

    <!-- 10^4 -->
    <line x1="545" y1="340" x2="545" y2="332" stroke="#000000" stroke-width="1.5"/>
    <text x="545" y="365" font-family="Times New Roman, STIXGeneral, serif" font-size="17" text-anchor="middle">10<tspan baseline-shift="super" font-size="12">4</tspan></text>

    <!-- Asymptote lines & Reference dashed lines -->
    <!-- Horizontal extension of 20 dB asymptote to x=465 -->
    <line x1="410" y1="130" x2="465" y2="130" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4"/>
    <!-- Vertical dashed line from f=100 kHz (x=425) up to 20 dB line -->
    <line x1="425" y1="340" x2="425" y2="130" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,4"/>

    <!-- Sloped high-frequency asymptote: from (425, 130) through (485, 340) -->
    <!-- Frequency response curve (actual curve) -->
    <!-- Flat at y=130 from x=140 to x=380, rounds through (425, 161.5) and asymptotically merges into the line reaching (485, 340) -->
    <path d="M 140 130 
             L 380 130 
             C 405 130, 418 145, 425 161.5 
             C 432 178, 445 235, 470 295 
             L 485 340" 
          fill="none" stroke="#000000" stroke-width="2.5"/>

    <!-- 3 dB measurement lines -->
    <!-- Top guide at y=130 -->
    <line x1="425" y1="130" x2="465" y2="130" stroke="#000000" stroke-width="1"/>
    <!-- Bottom guide at y=161.5 -->
    <line x1="425" y1="161.5" x2="465" y2="161.5" stroke="#000000" stroke-width="1"/>

    <!-- Arrows pointing to 3 dB interval at x=460 -->
    <line x1="460" y1="112" x2="460" y2="129" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
    <line x1="460" y1="179.5" x2="460" y2="162.5" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

    <!-- "3 dB" text -->
    <text x="473" y="151" font-family="Times New Roman, STIXGeneral, serif" font-size="16">3 dB</text>

    <!-- Slope annotation: "-20 dB/decade" with pointer -->
    <text x="515" y="195" font-family="Times New Roman, STIXGeneral, serif" font-size="16">−20 dB/decade</text>
    <path d="M 510 190 C 485 190, 475 210, 465 240" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  </g>
</svg>
