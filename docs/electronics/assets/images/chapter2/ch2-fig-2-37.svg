<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="100%" height="100%" role="img" aria-labelledby="title-2-37 desc-2-37">
  <title id="title-2-37">Figure 2.37 Illustrating the need for a continuous dc path for op-amp input terminals</title>
  <desc id="desc-2-37">Illustrating the need for a continuous dc path for each of the op-amp input terminals. Specifically, note that the amplifier will not work without resistor R3.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <style>
      .wire { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .cap-plate { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: round; }
      .opamp-body { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
      .term { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .junc { fill: #000000; }
      .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 19px; fill: #000000; }
      .math-up { font-family: 'Times New Roman', Times, Georgia, serif; font-style: normal; font-size: 19px; fill: #000000; }
      .sub-norm { font-size: 13px; font-style: normal; }
      .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Op Amp Triangle Symbol -->
  <polygon points="220,100 330,160 220,220" class="opamp-body"/>
  <text class="opamp-sign" x="234" y="129">−</text>
  <text class="opamp-sign" x="234" y="191">+</text>

  <!-- Inverting Input Branch (y = 130) -->
  <!-- Wire from ground to C1 -->
  <line class="wire" x1="60" y1="175" x2="60" y2="130"/>
  <line class="wire" x1="60" y1="130" x2="81" y2="130"/>

  <!-- Ground at C1 input -->
  <line class="wire" x1="46" y1="175" x2="74" y2="175"/>
  <line class="wire" x1="51" y1="180" x2="69" y2="180"/>
  <line class="wire" x1="56" y1="185" x2="64" y2="185"/>

  <!-- Capacitor C1 -->
  <line class="cap-plate" x1="81" y1="116" x2="81" y2="144"/>
  <line class="cap-plate" x1="89" y1="116" x2="89" y2="144"/>
  <text class="math" x="85" y="106" text-anchor="middle">C<tspan class="sub-norm" dy="4">1</tspan></text>

  <!-- Wire between C1 and R1 -->
  <line class="wire" x1="89" y1="130" x2="125" y2="130"/>

  <!-- Resistor R1 -->
  <path class="wire" d="M 125,130 l 10,0 l 3.33,-9 l 6.67,18 l 6.67,-18 l 6.67,18 l 6.67,-18 l 6.67,18 l 3.33,-9 l 10,0"/>
  <text class="math" x="155" y="110" text-anchor="middle">R<tspan class="sub-norm" dy="4">1</tspan></text>

  <!-- Wire from R1 to Inverting Terminal -->
  <line class="wire" x1="185" y1="130" x2="220" y2="130"/>
  <circle class="junc" cx="185" cy="130" r="3.5"/>

  <!-- Feedback Path (R2) -->
  <line class="wire" x1="185" y1="130" x2="185" y2="55"/>
  <line class="wire" x1="185" y1="55" x2="235" y2="55"/>
  <path class="wire" d="M 235,55 l 10,0 l 3.33,-9 l 6.67,18 l 6.67,-18 l 6.67,18 l 6.67,-18 l 6.67,18 l 3.33,-9 l 10,0"/>
  <text class="math" x="265" y="38" text-anchor="middle">R<tspan class="sub-norm" dy="4">2</tspan></text>
  <line class="wire" x1="295" y1="55" x2="350" y2="55"/>
  <line class="wire" x1="350" y1="55" x2="350" y2="160"/>

  <!-- Noninverting Input Branch (y = 190) -->
  <!-- Input Terminal -->
  <circle class="term" cx="85" cy="190" r="4.5"/>
  <line class="wire" x1="89.5" y1="190" x2="146" y2="190"/>

  <!-- Capacitor C2 -->
  <line class="cap-plate" x1="146" y1="176" x2="146" y2="204"/>
  <line class="cap-plate" x1="154" y1="176" x2="154" y2="204"/>
  <text class="math" x="150" y="222" text-anchor="middle">C<tspan class="sub-norm" dy="4">2</tspan></text>

  <!-- Wire from C2 to Noninverting Terminal and Resistor R3 -->
  <line class="wire" x1="154" y1="190" x2="220" y2="190"/>
  <circle class="junc" cx="205" cy="190" r="3.5"/>

  <!-- Resistor R3 = R2 (Vertical branch down from node at 205, 190) -->
  <line class="wire" x1="205" y1="190" x2="205" y2="210"/>
  <path class="wire" d="M 205,210 l 0,5 l -9,3.33 l 18,6.67 l -18,6.67 l 18,6.67 l -18,6.67 l 18,6.67 l -9,3.33 l 0,5"/>
  <text class="math" x="220" y="246" text-anchor="start">R<tspan class="sub-norm" dy="4">3</tspan><tspan class="math-up" dy="-4" dx="3"> = </tspan><tspan dx="3">R</tspan><tspan class="sub-norm" dy="4">2</tspan></text>

  <!-- Wire from R3 to Ground -->
  <line class="wire" x1="205" y1="260" x2="205" y2="280"/>

  <!-- Ground at R3 -->
  <line class="wire" x1="191" y1="280" x2="219" y2="280"/>
  <line class="wire" x1="196" y1="285" x2="214" y2="285"/>
  <line class="wire" x1="201" y1="290" x2="209" y2="290"/>

  <!-- Output Terminal Branch (y = 160) -->
  <line class="wire" x1="330" y1="160" x2="395.5" y2="160"/>
  <circle class="junc" cx="350" cy="160" r="3.5"/>
  <circle class="term" cx="400" cy="160" r="4.5"/>
</svg>
