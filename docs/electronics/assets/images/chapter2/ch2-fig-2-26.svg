<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="100%" height="100%" role="img" aria-labelledby="title-2-26 desc-2-26">
  <title id="title-2-26">Figure 2.26 The Miller integrator with a large resistance RF</title>
  <desc id="desc-2-26">Circuit schematic of a practical Miller integrator with feedback resistor RF connected in parallel with capacitor C to provide finite DC gain and prevent saturation.</desc>

  <style>
    .wire { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
    .term { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .junc { fill: #000000; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; fill: #000000; }
    .math { font-family: "Times New Roman", Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #000000; }
    .sub { font-size: 0.72em; font-style: italic; baseline-shift: sub; }
    .sub-norm { font-size: 0.72em; font-style: normal; baseline-shift: sub; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Input Terminal & Voltage vI(t) -->
  <circle class="term" cx="70" cy="230" r="4.5"/>
  <text class="sign" x="70" y="255">+</text>
  <text class="math" x="70" y="285" text-anchor="middle">v<tspan class="sub">I</tspan>(t)</text>
  <text class="sign" x="70" y="315">−</text>
  <!-- Input Ground at (70, 335) -->
  <line class="wire" x1="57" y1="335" x2="83" y2="335"/>
  <line class="wire" x1="62" y1="340" x2="78" y2="340"/>
  <line class="wire" x1="66" y1="345" x2="74" y2="345"/>

  <!-- Series Resistor R -->
  <line class="wire" x1="75" y1="230" x2="105" y2="230"/>
  <path class="wire" d="M 105,230 L 111,230 L 116,221 L 126,239 L 136,221 L 146,239 L 156,221 L 166,239 L 171,230 L 177,230"/>
  <line class="wire" x1="177" y1="230" x2="210" y2="230"/>
  <text class="math" x="141" y="212" text-anchor="middle">R</text>

  <!-- Inverting node junction -->
  <circle class="junc" cx="210" cy="230" r="3.5"/>
  <line class="wire" x1="210" y1="230" x2="260" y2="230"/>

  <!-- Op-amp Body -->
  <polygon class="opamp-body" points="260,205 350,250 260,295"/>
  <text class="sign" x="274" y="230">−</text>
  <text class="sign" x="274" y="270">+</text>

  <!-- Non-inverting terminal to Ground -->
  <path class="wire" d="M 260,270 L 240,270 L 240,320"/>
  <!-- Ground at (240, 320) -->
  <line class="wire" x1="227" y1="320" x2="253" y2="320"/>
  <line class="wire" x1="232" y1="325" x2="248" y2="325"/>
  <line class="wire" x1="236" y1="330" x2="244" y2="330"/>

  <!-- Feedback Network Left Vertical -->
  <line class="wire" x1="210" y1="230" x2="210" y2="160"/>
  <circle class="junc" cx="210" cy="160" r="3.5"/>

  <!-- Branch 1: Capacitor C -->
  <line class="wire" x1="210" y1="160" x2="295" y2="160"/>
  <!-- Capacitor C plates -->
  <line class="wire" x1="295" y1="146" x2="295" y2="174"/>
  <line class="wire" x1="305" y1="146" x2="305" y2="174"/>
  <text class="math" x="300" y="136" text-anchor="middle">C</text>
  <line class="wire" x1="305" y1="160" x2="400" y2="160"/>

  <!-- Branch 2: Resistor RF -->
  <path class="wire" d="M 210,160 L 210,95 L 265,95"/>
  <path class="wire" d="M 265,95 L 271,95 L 276,86 L 286,104 L 296,86 L 306,104 L 316,86 L 326,104 L 331,95 L 337,95"/>
  <text class="math" x="301" y="78" text-anchor="middle">R<tspan class="sub">F</tspan></text>
  <path class="wire" d="M 337,95 L 400,95 L 400,160"/>

  <!-- Feedback Network Right Merge -->
  <circle class="junc" cx="400" cy="160" r="3.5"/>
  <line class="wire" x1="400" y1="160" x2="400" y2="250"/>

  <!-- Op-amp Output Wire -->
  <line class="wire" x1="350" y1="250" x2="460" y2="250"/>
  <circle class="junc" cx="400" cy="250" r="3.5"/>
  <circle class="term" cx="460" cy="250" r="4.5"/>

  <!-- Output Voltage vO(t) -->
  <text class="sign" x="460" y="275">+</text>
  <text class="math" x="460" y="305" text-anchor="middle">v<tspan class="sub-norm">O</tspan>(t)</text>
  <text class="sign" x="460" y="335">−</text>
  <!-- Output Ground at (460, 355) -->
  <line class="wire" x1="447" y1="355" x2="473" y2="355"/>
  <line class="wire" x1="452" y1="360" x2="468" y2="360"/>
  <line class="wire" x1="456" y1="365" x2="464" y2="365"/>
</svg>
