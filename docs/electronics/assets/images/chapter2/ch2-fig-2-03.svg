<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <title>Figure 2.3 Equivalent circuit of the ideal op amp</title>
  <desc>Equivalent circuit model of the ideal operational amplifier showing infinite input impedance (open circuit between input terminals 1 and 2, zero input currents) and a controlled voltage source of value A(v2 - v1) at output terminal 3 with zero output impedance.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .wire { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .symbol { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .terminal { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .source { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .arrow { fill: #000000; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #000000; }
      .math { font-family: "Times New Roman", Times, "Nimbus Roman No9 L", serif; font-size: 16px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .pm { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .callout { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #000000; }
    </style>
  </defs>

  <!-- Op Amp Triangle Body -->
  <polygon points="260,40 520,190 260,340" class="symbol"/>

  <!-- ==================== INVERTING INPUT (Terminal 1) ==================== -->
  <!-- Callout text & curved arrow -->
  <text x="145" y="45" class="callout" text-anchor="middle">Inverting input</text>
  <path d="M 160,52 Q 175,70 178,88" class="wire"/>
  <polygon points="178,92 174,83 182,85" class="arrow"/>

  <!-- Source v1 -->
  <circle cx="140" cy="140" r="16" class="source"/>
  <text x="140" y="133" class="pm">+</text>
  <text x="140" y="148" class="pm">−</text>
  <text x="110" y="140" class="math">v<tspan font-style="normal" font-size="11px" dy="3">1</tspan></text>

  <!-- Ground at v1 -->
  <line x1="140" y1="156" x2="140" y2="175" class="wire"/>
  <line x1="128" y1="175" x2="152" y2="175" class="wire"/>
  <line x1="132" y1="179" x2="148" y2="179" class="wire"/>
  <line x1="136" y1="183" x2="144" y2="183" class="wire"/>

  <!-- Wire from v1 to Terminal 1 -->
  <polyline points="140,124 140,95 272,95" class="wire"/>
  <circle cx="180" cy="95" r="3.5" class="terminal"/>
  <text x="205" y="82" class="math" font-style="normal">1</text>

  <!-- Current arrow i1 = 0 -->
  <line x1="190" y1="112" x2="218" y2="112" class="wire"/>
  <polygon points="224,112 215,108 215,116" class="arrow"/>
  <text x="205" y="125" class="math">i<tspan font-style="normal" font-size="11px" dy="3">1</tspan><tspan font-style="normal" font-size="15px" dy="-3"> = 0</tspan></text>

  <!-- Internal Terminal 1 circle and minus sign -->
  <circle cx="276" cy="95" r="3.5" class="terminal"/>
  <text x="276" y="112" class="pm">−</text>

  <!-- ==================== NONINVERTING INPUT (Terminal 2) ==================== -->
  <!-- Source v2 -->
  <circle cx="140" cy="305" r="16" class="source"/>
  <text x="140" y="298" class="pm">+</text>
  <text x="140" y="313" class="pm">−</text>
  <text x="110" y="305" class="math">v<tspan font-style="normal" font-size="11px" dy="3">2</tspan></text>

  <!-- Ground at v2 -->
  <line x1="140" y1="321" x2="140" y2="340" class="wire"/>
  <line x1="128" y1="340" x2="152" y2="340" class="wire"/>
  <line x1="132" y1="344" x2="148" y2="344" class="wire"/>
  <line x1="136" y1="348" x2="144" y2="348" class="wire"/>

  <!-- Wire from v2 to Terminal 2 -->
  <polyline points="140,289 140,260 272,260" class="wire"/>
  <circle cx="180" cy="260" r="3.5" class="terminal"/>
  <text x="205" y="275" class="math" font-style="normal">2</text>

  <!-- Current arrow i2 = 0 -->
  <line x1="190" y1="243" x2="218" y2="243" class="wire"/>
  <polygon points="224,243 215,239 215,247" class="arrow"/>
  <text x="205" y="230" class="math">i<tspan font-style="normal" font-size="11px" dy="3">2</tspan><tspan font-style="normal" font-size="15px" dy="-3"> = 0</tspan></text>

  <!-- Internal Terminal 2 circle and plus sign -->
  <circle cx="276" cy="260" r="3.5" class="terminal"/>
  <text x="276" y="243" class="pm">+</text>

  <!-- Callout text & curved arrow -->
  <text x="170" y="385" class="callout" text-anchor="middle">Noninverting</text>
  <text x="170" y="402" class="callout" text-anchor="middle">input</text>
  <path d="M 165,370 Q 170,300 178,268" class="wire"/>
  <polygon points="179,264 174,272 182,271" class="arrow"/>

  <!-- ==================== DEPENDENT SOURCE & OUTPUT ==================== -->
  <!-- Controlled Source Diamond -->
  <polygon points="385,190 405,210 385,230 365,210" class="symbol"/>
  <text x="385" y="203" class="pm">+</text>
  <text x="385" y="217" class="pm">−</text>
  <text x="315" y="210" class="math">A(v<tspan font-style="normal" font-size="11px" dy="3">2</tspan><tspan font-style="normal" font-size="16px" dy="-3"> − </tspan>v<tspan font-style="normal" font-size="11px" dy="3">1</tspan><tspan font-style="normal" font-size="16px" dy="-3">)</tspan></text>

  <!-- Ground at Controlled Source -->
  <line x1="385" y1="230" x2="385" y2="255" class="wire"/>
  <line x1="373" y1="255" x2="397" y2="255" class="wire"/>
  <line x1="377" y1="259" x2="393" y2="259" class="wire"/>
  <line x1="381" y1="263" x2="389" y2="263" class="wire"/>

  <!-- Wire from diamond top to output -->
  <line x1="385" y1="190" x2="540" y2="190" class="wire"/>

  <!-- Output Terminal 3 -->
  <circle cx="544" cy="190" r="3.5" class="terminal"/>
  <text x="532" y="178" class="math" font-style="normal">3</text>
  <text x="562" y="190" class="math">v<tspan font-style="normal" font-size="11px" dy="3">3</tspan></text>

  <!-- Output Callout -->
  <text x="560" y="130" class="callout" text-anchor="middle">Output</text>
  <path d="M 555,138 Q 550,160 546,182" class="wire"/>
  <polygon points="545,186 543,177 550,179" class="arrow"/>
</svg>
