<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="100%" height="100%" role="img" aria-labelledby="title-2-13 desc-2-13">
  <title id="title-2-13">Figure 2.13 Analysis of the Noninverting Circuit</title>
  <desc id="desc-2-13">Step-by-step analysis of the noninverting operational amplifier circuit with circled numbers 1 to 6 showing virtual short, node voltages, branch currents, and the closed-loop gain derivation.</desc>

  <style>
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .math-sm { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 16px; fill: #111111; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .step-circle { fill: #111111; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .arrow-line { fill: none; stroke: #111111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: #111111; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Left Ground and R1 -->
  <path class="wire" d="M 65 195 L 65 160 L 170 160"/>
  <line class="wire" x1="65" y1="195" x2="65" y2="205"/>
  <line class="wire" x1="51" y1="205" x2="79" y2="205"/>
  <line class="wire" x1="56" y1="210" x2="74" y2="210"/>
  <line class="wire" x1="61" y1="215" x2="69" y2="215"/>
  <path class="wire" d="M 170.0,160.0 L 178.0,160.0 L 184.7,151.5 L 191.3,168.5 L 198.0,151.5 L 204.7,168.5 L 211.3,151.5 L 218.0,160.0 L 226.0,160.0"/>
  <line class="wire" x1="226" y1="160" x2="360" y2="160"/>
  <text class="math" x="190" y="140">R<tspan class="sub-norm">1</tspan></text>
  <circle class="junc" cx="265" cy="160" r="3.5"/>

  <!-- Step 3: Current left through R1 -->
  <circle class="step-circle" cx="80" cy="132" r="11"/>
  <text class="step-num" x="80" y="132">3</text>
  <line class="arrow-line" x1="145" y1="142" x2="108" y2="142"/>
  <polygon points="108,139 100,142 108,145" class="arrow"/>
  <!-- Fraction vI / R1 -->
  <g transform="translate(122, 116)">
    <text class="math-sm" x="0" y="0" text-anchor="middle">v<tspan class="sub">I</tspan></text>
    <line class="wire" x1="-12" y1="5" x2="12" y2="5" stroke-width="1.5"/>
    <text class="math-sm" x="0" y="20" text-anchor="middle">R<tspan class="sub-norm">1</tspan></text>
  </g>

  <!-- Feedback path R2 -->
  <path class="wire" d="M 265 160 L 265 80 L 370 80"/>
  <path class="wire" d="M 370.0,80.0 L 378.0,80.0 L 384.7,71.5 L 391.3,88.5 L 398.0,71.5 L 404.7,88.5 L 411.3,71.5 L 418.0,80.0 L 426.0,80.0"/>
  <path class="wire" d="M 426 80 L 495 80 L 495 190"/>
  <text class="math" x="390" y="62">R<tspan class="sub-norm">2</tspan></text>

  <!-- Step 5: Current left through R2 -->
  <circle class="step-circle" cx="290" cy="52" r="11"/>
  <text class="step-num" x="290" y="52">5</text>
  <line class="arrow-line" x1="355" y1="62" x2="318" y2="62"/>
  <polygon points="318,59 310,62 318,65" class="arrow"/>
  <!-- Fraction vI / R1 -->
  <g transform="translate(332, 36)">
    <text class="math-sm" x="0" y="0" text-anchor="middle">v<tspan class="sub">I</tspan></text>
    <line class="wire" x1="-12" y1="5" x2="12" y2="5" stroke-width="1.5"/>
    <text class="math-sm" x="0" y="20" text-anchor="middle">R<tspan class="sub-norm">1</tspan></text>
  </g>

  <!-- Op-Amp Body -->
  <polygon points="360,133 445,190 360,247" class="opamp-body"/>
  <text class="opamp-sign" x="373" y="160">−</text>
  <text class="opamp-sign" x="373" y="220">+</text>

  <!-- Step 2: Inverting node potential vI -->
  <circle class="step-circle" cx="300" cy="138" r="11"/>
  <text class="step-num" x="300" y="138">2</text>
  <text class="math" x="320" y="144">v<tspan class="sub">I</tspan></text>

  <!-- Step 4: Zero current into inverting input -->
  <circle class="step-circle" cx="320" cy="182" r="11"/>
  <text class="step-num" x="320" y="182">4</text>
  <line class="arrow-line" x1="312" y1="168" x2="344" y2="168"/>
  <polygon points="344,165 352,168 344,171" class="arrow"/>
  <text class="math" x="340" y="187">0</text>

  <!-- Non-inverting input terminal -->
  <line class="wire" x1="360" y1="220" x2="295" y2="220"/>
  <circle class="term" cx="295" cy="220" r="4.5"/>

  <!-- Step 1: Virtual short circuit between terminals -->
  <text class="sign" x="295" y="180">−</text>
  <text class="sign" x="295" y="203">+</text>
  <circle class="step-circle" cx="230" cy="191" r="11"/>
  <text class="step-num" x="230" y="191">1</text>
  <text class="math" x="248" y="197">v<tspan class="sub">Id</tspan> = 0</text>

  <!-- Input source markings under non-inverting terminal -->
  <text class="sign" x="295" y="240">+</text>
  <text class="math" x="288" y="268">v<tspan class="sub">I</tspan></text>
  <text class="sign" x="295" y="295">−</text>
  <circle class="term" cx="295" cy="315" r="4.5"/>
  <line class="wire" x1="295" y1="320" x2="295" y2="330"/>
  <line class="wire" x1="281" y1="330" x2="309" y2="330"/>
  <line class="wire" x1="286" y1="335" x2="304" y2="335"/>
  <line class="wire" x1="291" y1="340" x2="299" y2="340"/>

  <!-- Output stage -->
  <line class="wire" x1="445" y1="190" x2="495" y2="190"/>
  <circle class="junc" cx="495" cy="190" r="3.5"/>
  <line class="wire" x1="495" y1="190" x2="535" y2="190"/>
  <circle class="term" cx="535" cy="190" r="4.5"/>

  <!-- Output voltage markers -->
  <text class="sign" x="535" y="215">+</text>
  <text class="math" x="528" y="250">v<tspan class="sub">O</tspan></text>
  <text class="sign" x="535" y="285">−</text>
  <circle class="term" cx="535" cy="305" r="4.5"/>
  <line class="wire" x1="535" y1="310" x2="535" y2="320"/>
  <line class="wire" x1="521" y1="320" x2="549" y2="320"/>
  <line class="wire" x1="526" y1="325" x2="544" y2="325"/>
  <line class="wire" x1="531" y1="330" x2="539" y2="330"/>

  <!-- Step 6: Closed-loop derivation formulas -->
  <g transform="translate(505, 90)">
    <!-- Line 1: vO = vI + (vI / R1) R2 -->
    <text class="math" x="0" y="0">v<tspan class="sub">O</tspan> = v<tspan class="sub">I</tspan> +</text>
    <g transform="translate(72, -14)">
      <text class="math-sm" x="0" y="0" text-anchor="middle">v<tspan class="sub">I</tspan></text>
      <line class="wire" x1="-12" y1="4" x2="12" y2="4" stroke-width="1.5"/>
      <text class="math-sm" x="0" y="18" text-anchor="middle">R<tspan class="sub-norm">1</tspan></text>
    </g>
    <text class="math" x="90" y="0">R<tspan class="sub-norm">2</tspan></text>

    <!-- Line 2: = vI (1 + R2 / R1) -->
    <text class="math" x="24" y="38">= v<tspan class="sub">I</tspan> <tspan font-style="normal">(</tspan>1 +</text>
    <g transform="translate(100, 24)">
      <text class="math-sm" x="0" y="0" text-anchor="middle">R<tspan class="sub-norm">2</tspan></text>
      <line class="wire" x1="-12" y1="4" x2="12" y2="4" stroke-width="1.5"/>
      <text class="math-sm" x="0" y="18" text-anchor="middle">R<tspan class="sub-norm">1</tspan></text>
    </g>
    <text class="math" x="114" y="38"><tspan font-style="normal">)</tspan></text>

    <!-- Step 6 circle -->
    <circle class="step-circle" cx="150" cy="18" r="11"/>
    <text class="step-num" x="150" y="18">6</text>
  </g>
</svg>