<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="100%" height="100%" role="img" aria-labelledby="title-2-14 desc-2-14">
  <title id="title-2-14">Figure 2.14 Unity-Gain Buffer (Follower) and Equivalent Circuit Model</title>
  <desc id="desc-2-14">(a) The unity-gain buffer or follower amplifier circuit with direct negative feedback. (b) Its equivalent circuit model showing infinite input impedance and unity-gain dependent voltage source.</desc>

  <style>
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dash { fill: none; stroke: #888888; stroke-width: 1.5; stroke-dasharray: 5,4; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .lbl-subfig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: bold; fill: #111111; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= SUBFIGURE (a) ================= -->
  <!-- Direct Feedback Loop -->
  <path class="wire" d="M 180 135 L 145 135 L 145 75 L 290 75 L 290 165"/>

  <!-- Op-Amp Body -->
  <polygon points="180,108 265,165 180,222" class="opamp-body"/>
  <text class="opamp-sign" x="193" y="135">−</text>
  <text class="opamp-sign" x="193" y="195">+</text>

  <!-- Non-inverting input with input terminal and voltage source vI -->
  <line class="wire" x1="180" y1="195" x2="145" y2="195"/>
  <circle class="term" cx="145" cy="195" r="4.5"/>
  <path class="wire" d="M 140.5 195 L 90 195 L 90 228"/>
  <circle class="comp-bg" cx="90" cy="250" r="22"/>
  <text class="sign" x="90" y="241">+</text>
  <text class="sign" x="90" y="262">−</text>
  <text class="math" x="40" y="256">v<tspan class="sub">I</tspan></text>
  <line class="wire" x1="90" y1="272" x2="90" y2="285"/>
  <line class="wire" x1="90" y1="285" x2="90" y2="295"/>
  <line class="wire" x1="76" y1="295" x2="104" y2="295"/>
  <line class="wire" x1="81" y1="300" x2="99" y2="300"/>
  <line class="wire" x1="86" y1="305" x2="94" y2="305"/>

  <!-- Output wire and terminal -->
  <line class="wire" x1="265" y1="165" x2="290" y2="165"/>
  <circle class="junc" cx="290" cy="165" r="3.5"/>
  <line class="wire" x1="290" y1="165" x2="335" y2="165"/>
  <circle class="term" cx="335" cy="165" r="4.5"/>

  <!-- Output voltage indicators: vO = vI -->
  <text class="sign" x="335" y="195">+</text>
  <text class="math" x="335" y="225" text-anchor="middle">v<tspan class="sub">O</tspan> = v<tspan class="sub">I</tspan></text>
  <text class="sign" x="335" y="255">−</text>
  <line class="wire" x1="335" y1="270" x2="335" y2="280"/>
  <line class="wire" x1="321" y1="280" x2="349" y2="280"/>
  <line class="wire" x1="326" y1="285" x2="344" y2="285"/>
  <line class="wire" x1="331" y1="290" x2="339" y2="290"/>

  <text class="lbl-subfig" x="200" y="325">(a)</text>


  <!-- ================= SUBFIGURE (b) ================= -->
  <!-- Subtle amplifier block bounding box -->
  <rect class="wire-dash" x="475" y="80" width="225" height="150" rx="4"/>

  <!-- Input Terminals on left -->
  <circle class="term" cx="435" cy="105" r="4.5"/>
  <line class="wire" x1="440" y1="105" x2="505" y2="105"/>
  <circle class="term" cx="505" cy="105" r="4.5"/>

  <!-- Voltage indicators across input -->
  <text class="sign" x="505" y="132">+</text>
  <text class="math" x="500" y="158">v<tspan class="sub">I</tspan></text>
  <text class="sign" x="505" y="182">−</text>

  <!-- Continuous ground line from lower input to lower output -->
  <circle class="term" cx="435" cy="210" r="4.5"/>
  <line class="wire" x1="440" y1="210" x2="735" y2="210"/>
  <circle class="term" cx="740" cy="210" r="4.5"/>

  <!-- Ground on bottom rail -->
  <circle class="junc" cx="560" cy="210" r="3.5"/>
  <line class="wire" x1="560" y1="210" x2="560" y2="220"/>
  <line class="wire" x1="546" y1="220" x2="574" y2="220"/>
  <line class="wire" x1="551" y1="225" x2="569" y2="225"/>
  <line class="wire" x1="556" y1="230" x2="564" y2="230"/>

  <!-- Dependent Voltage Source: Diamond -->
  <circle class="junc" cx="600" cy="210" r="3.5"/>
  <line class="wire" x1="600" y1="210" x2="600" y2="183"/>
  <polygon points="600,135 624,159 600,183 576,159" class="comp-bg"/>
  <text class="sign" x="600" y="150">+</text>
  <text class="sign" x="600" y="171">−</text>
  <text class="math" x="635" y="165">1 × v<tspan class="sub">I</tspan></text>

  <!-- Wire from top of diamond to output terminal -->
  <path class="wire" d="M 600 135 L 600 105 L 735 105"/>
  <circle class="term" cx="740" cy="105" r="4.5"/>

  <!-- Output voltage markers -->
  <text class="sign" x="770" y="132">+</text>
  <text class="math" x="763" y="158">v<tspan class="sub">O</tspan></text>
  <text class="sign" x="770" y="182">−</text>

  <text class="lbl-subfig" x="600" y="325">(b)</text>
</svg>