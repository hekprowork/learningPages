<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="100%" height="100%">
  <title>Figure 2.2 The op amp shown connected to dc power supplies</title>
  <desc>Schematic diagrams showing an operational amplifier with DC power supply connections: (a) simplified single-rail representation with +VCC and -VEE arrows, and (b) complete circuit showing positive and negative DC battery supplies referenced to ground.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .wire { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .symbol { stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .terminal { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .dot { fill: #000000; }
      .battery-long { stroke: #000000; stroke-width: 2; stroke-linecap: round; }
      .battery-short { stroke: #000000; stroke-width: 3.5; stroke-linecap: round; }
      .arrow { fill: #000000; }
      .label { font-family: "Times New Roman", Times, "Nimbus Roman No9 L", serif; font-size: 17px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .math { font-family: "Times New Roman", Times, "Nimbus Roman No9 L", serif; font-size: 17px; font-style: italic; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .pm { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 18px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; fill: #000000; text-anchor: middle; }
    </style>
  </defs>

  <!-- ==================== SUBFIGURE (a) ==================== -->
  <g id="subfig-a">
    <!-- Op Amp Triangle -->
    <polygon points="135,115 235,170 135,225" class="symbol"/>

    <!-- Terminal 1 (-) -->
    <line x1="80" y1="140" x2="135" y2="140" class="wire"/>
    <circle cx="80" cy="140" r="4" class="terminal"/>
    <text x="80" y="122" class="label">1</text>
    <text x="149" y="140" class="pm">−</text>

    <!-- Terminal 2 (+) -->
    <line x1="80" y1="200" x2="135" y2="200" class="wire"/>
    <circle cx="80" cy="200" r="4" class="terminal"/>
    <text x="80" y="182" class="label">2</text>
    <text x="149" y="200" class="pm">+</text>

    <!-- Terminal 3 (Output) -->
    <line x1="235" y1="170" x2="290" y2="170" class="wire"/>
    <circle cx="290" cy="170" r="4" class="terminal"/>
    <text x="268" y="156" class="label">3</text>

    <!-- Terminal 4 (+ Supply) -->
    <line x1="175" y1="137" x2="175" y2="114" class="wire"/>
    <circle cx="175" cy="110" r="4" class="terminal"/>
    <line x1="175" y1="106" x2="175" y2="72" class="wire"/>
    <polygon points="175,60 170,74 180,74" class="arrow"/>
    <text x="190" y="110" class="label">4</text>
    <text x="175" y="44" class="math">V<tspan font-style="normal" font-size="12px" dy="3">CC</tspan></text>

    <!-- Terminal 5 (- Supply) -->
    <line x1="175" y1="203" x2="175" y2="226" class="wire"/>
    <circle cx="175" cy="230" r="4" class="terminal"/>
    <line x1="175" y1="234" x2="175" y2="268" class="wire"/>
    <polygon points="175,280 170,266 180,266" class="arrow"/>
    <text x="190" y="230" class="label">5</text>
    <text x="175" y="302" class="math">−V<tspan font-style="normal" font-size="12px" dy="3">EE</tspan></text>

    <!-- Caption (a) -->
    <text x="175" y="345" class="sublabel">(a)</text>
  </g>

  <!-- ==================== SUBFIGURE (b) ==================== -->
  <g id="subfig-b">
    <!-- Op Amp Triangle -->
    <polygon points="445,115 545,170 445,225" class="symbol"/>

    <!-- Terminal 1 (-) -->
    <line x1="390" y1="140" x2="445" y2="140" class="wire"/>
    <circle cx="390" cy="140" r="4" class="terminal"/>
    <text x="390" y="122" class="label">1</text>
    <text x="459" y="140" class="pm">−</text>

    <!-- Terminal 2 (+) -->
    <line x1="390" y1="200" x2="445" y2="200" class="wire"/>
    <circle cx="390" cy="200" r="4" class="terminal"/>
    <text x="390" y="182" class="label">2</text>
    <text x="459" y="200" class="pm">+</text>

    <!-- Terminal 3 (Output) -->
    <line x1="545" y1="170" x2="600" y2="170" class="wire"/>
    <circle cx="600" cy="170" r="4" class="terminal"/>
    <text x="578" y="156" class="label">3</text>

    <!-- Terminal 4 (+ Supply connection) -->
    <line x1="485" y1="137" x2="485" y2="114" class="wire"/>
    <circle cx="485" cy="110" r="4" class="terminal"/>
    <text x="500" y="110" class="label">4</text>
    <!-- Wire up and right to VCC battery -->
    <polyline points="485,106 485,70 635,70 635,100" class="wire"/>

    <!-- VCC Battery: 4 plates (long, short, long, short) -->
    <line x1="619" y1="100" x2="651" y2="100" class="battery-long"/>
    <line x1="626" y1="106" x2="644" y2="106" class="battery-short"/>
    <line x1="619" y1="112" x2="651" y2="112" class="battery-long"/>
    <line x1="626" y1="118" x2="644" y2="118" class="battery-short"/>
    <text x="675" y="110" class="math">V<tspan font-style="normal" font-size="12px" dy="3">CC</tspan></text>

    <!-- Wire from VCC battery to center ground node -->
    <line x1="635" y1="118" x2="635" y2="202" class="wire"/>
    <circle cx="635" cy="170" r="3.5" class="dot"/>

    <!-- Ground connection from center node -->
    <line x1="635" y1="170" x2="675" y2="170" class="wire"/>
    <line x1="675" y1="160" x2="675" y2="180" class="wire"/>
    <line x1="680" y1="164" x2="680" y2="176" class="wire"/>
    <line x1="685" y1="167" x2="685" y2="173" class="wire"/>

    <!-- VEE Battery: 4 plates (long, short, long, short from top to bottom) -->
    <line x1="619" y1="202" x2="651" y2="202" class="battery-long"/>
    <line x1="626" y1="208" x2="644" y2="208" class="battery-short"/>
    <line x1="619" y1="214" x2="651" y2="214" class="battery-long"/>
    <line x1="626" y1="220" x2="644" y2="220" class="battery-short"/>
    <text x="675" y="212" class="math">V<tspan font-style="normal" font-size="12px" dy="3">EE</tspan></text>

    <!-- Wire down and left from VEE battery to Terminal 5 -->
    <polyline points="635,220 635,270 485,270 485,234" class="wire"/>
    <circle cx="485" cy="230" r="4" class="terminal"/>
    <line x1="485" y1="226" x2="485" y2="203" class="wire"/>
    <text x="500" y="230" class="label">5</text>

    <!-- Caption (b) -->
    <text x="525" y="345" class="sublabel">(b)</text>
  </g>
</svg>
