<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%" role="img" aria-labelledby="title-2-34 desc-2-34">
  <title id="title-2-34">Figure 2.34 Analysis of the Closed-Loop Amplifier Taking into Account Input Bias Currents</title>
  <desc id="desc-2-34">Analysis of the closed-loop inverting amplifier with signal source grounded, evaluating output dc voltage Vo = IB1 * R2 caused by input bias currents.</desc>

  <style>
    .wire { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .term { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .junc { fill: #000000; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #000000; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 19px; fill: #000000; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .arrow { fill: #000000; }
    .arrow-line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Clean pure white background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Large Op-Amp Triangle Body -->
  <polygon points="320,50 530,225 320,400" class="opamp-body"/>
  <text class="opamp-sign" x="336" y="132">−</text>
  <text class="opamp-sign" x="336" y="258">+</text>

  <!-- ========================================== -->
  <!-- Internal Circuitry: Inverting Bias Current Model -->
  <!-- ========================================== -->
  <line class="wire" x1="320" y1="150" x2="385" y2="150"/>
  <circle class="term" cx="385" cy="150" r="4"/>
  <circle class="junc" cx="355" cy="150" r="3.5"/>
  <line class="wire" x1="355" y1="150" x2="355" y2="172"/>
  <circle class="comp-bg" cx="355" cy="188" r="16"/>
  <!-- Downward arrow inside source circle -->
  <line class="wire" x1="355" y1="180" x2="355" y2="198"/>
  <polygon points="351.5,193 358.5,193 355,200" class="arrow"/>
  <text class="math" x="380" y="194">I<tspan class="sub">B1</tspan></text>
  <!-- Connection to ground -->
  <line class="wire" x1="355" y1="204" x2="355" y2="225"/>
  <line class="wire" x1="341" y1="225" x2="369" y2="225"/>
  <line class="wire" x1="346" y1="230" x2="364" y2="230"/>
  <line class="wire" x1="351" y1="235" x2="359" y2="235"/>

  <!-- ========================================== -->
  <!-- Internal Circuitry: Non-inverting Bias Current Model -->
  <!-- ========================================== -->
  <line class="wire" x1="320" y1="275" x2="385" y2="275"/>
  <circle class="term" cx="385" cy="275" r="4"/>
  <circle class="junc" cx="355" cy="275" r="3.5"/>
  <line class="wire" x1="355" y1="275" x2="355" y2="297"/>
  <circle class="comp-bg" cx="355" cy="313" r="16"/>
  <!-- Downward arrow inside source circle -->
  <line class="wire" x1="355" y1="305" x2="355" y2="323"/>
  <polygon points="351.5,318 358.5,318 355,325" class="arrow"/>
  <text class="math" x="380" y="319">I<tspan class="sub">B2</tspan></text>
  <!-- Connection to ground -->
  <line class="wire" x1="355" y1="329" x2="355" y2="350"/>
  <line class="wire" x1="341" y1="350" x2="369" y2="350"/>
  <line class="wire" x1="346" y1="355" x2="364" y2="355"/>
  <line class="wire" x1="351" y1="360" x2="359" y2="360"/>

  <!-- ========================================== -->
  <!-- Inverting Input External Network (R1 to Ground) -->
  <!-- ========================================== -->
  <!-- Wire from R1 through junction to op-amp inverting terminal -->
  <line class="wire" x1="235" y1="150" x2="320" y2="150"/>
  <circle class="junc" cx="295" cy="150" r="3.5"/>
  <!-- 0 V label at inverting node -->
  <text class="txt" x="270" y="142" text-anchor="middle">0 V</text>

  <!-- Resistor R1 -->
  <path class="wire" d="M 185,150 l 5,0 l 3.33,-8 l 6.67,16 l 6.67,-16 l 6.67,16 l 6.67,-16 l 6.67,16 l 3.33,-8 l 5,0"/>
  <text class="math" x="210" y="132" text-anchor="middle">R<tspan class="sub-norm">1</tspan></text>

  <!-- Wire to signal ground -->
  <line class="wire" x1="140" y1="150" x2="185" y2="150"/>
  <line class="wire" x1="140" y1="150" x2="140" y2="180"/>
  <!-- Signal ground symbol -->
  <line class="wire" x1="126" y1="180" x2="154" y2="180"/>
  <line class="wire" x1="131" y1="185" x2="149" y2="185"/>
  <line class="wire" x1="136" y1="190" x2="144" y2="190"/>

  <!-- Current into R1 is zero: right-pointing arrow and "0" -->
  <line class="arrow-line" x1="145" y1="134" x2="175" y2="134"/>
  <polygon points="173,130.5 173,137.5 180,134" class="arrow"/>
  <text class="txt" x="155" y="145" text-anchor="middle">0</text>

  <!-- ========================================== -->
  <!-- Non-inverting Input External Connection (to Ground) -->
  <!-- ========================================== -->
  <line class="wire" x1="320" y1="275" x2="270" y2="275"/>
  <line class="wire" x1="270" y1="275" x2="270" y2="315"/>
  <!-- Ground symbol -->
  <line class="wire" x1="256" y1="315" x2="284" y2="315"/>
  <line class="wire" x1="261" y1="320" x2="279" y2="320"/>
  <line class="wire" x1="266" y1="325" x2="274" y2="325"/>

  <!-- ========================================== -->
  <!-- Feedback Path (R2) -->
  <!-- ========================================== -->
  <line class="wire" x1="295" y1="150" x2="295" y2="45"/>
  <line class="wire" x1="295" y1="45" x2="380" y2="45"/>
  <!-- Resistor R2 -->
  <path class="wire" d="M 380,45 l 5,0 l 3.33,-8 l 6.67,16 l 6.67,-16 l 6.67,16 l 6.67,-16 l 6.67,16 l 3.33,-8 l 5,0"/>
  <text class="math" x="405" y="28" text-anchor="middle">R<tspan class="sub-norm">2</tspan></text>
  <line class="wire" x1="430" y1="45" x2="550" y2="45"/>
  <line class="wire" x1="550" y1="45" x2="550" y2="225"/>

  <!-- Current Arrow on feedback loop: IB1 flowing leftwards -->
  <text class="math" x="340" y="22" text-anchor="middle">I<tspan class="sub">B1</tspan></text>
  <line class="arrow-line" x1="365" y1="32" x2="318" y2="32"/>
  <polygon points="320,28.5 320,35.5 313,32" class="arrow"/>

  <!-- ========================================== -->
  <!-- Output Terminal and Output Voltage VO = IB1 * R2 -->
  <!-- ========================================== -->
  <line class="wire" x1="530" y1="225" x2="580" y2="225"/>
  <circle class="junc" cx="550" cy="225" r="3.5"/>
  <circle class="term" cx="580" cy="225" r="4.5"/>

  <text class="sign" x="580" y="250">+</text>
  <text class="math" x="618" y="272" text-anchor="middle">V<tspan class="sub-norm">O</tspan> = I<tspan class="sub">B1</tspan>R<tspan class="sub-norm">2</tspan></text>
  <text class="sign" x="580" y="294">−</text>
  <!-- Output ground -->
  <line class="wire" x1="580" y1="300" x2="580" y2="308"/>
  <line class="wire" x1="566" y1="308" x2="594" y2="308"/>
  <line class="wire" x1="571" y1="313" x2="589" y2="313"/>
  <line class="wire" x1="576" y1="318" x2="584" y2="318"/>
</svg>
