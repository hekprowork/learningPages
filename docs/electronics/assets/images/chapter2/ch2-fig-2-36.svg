<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%" role="img" aria-labelledby="title-2-36 desc-2-36">
  <title id="title-2-36">Figure 2.36 AC-coupled inverting amplifier with bias-current compensation</title>
  <desc id="desc-2-36">In an ac-coupled amplifier the dc resistance seen by the inverting terminal is R2; hence R3 is chosen equal to R2.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <style>
      .wire { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .cap-plate { fill: none; stroke: #000000; stroke-width: 2.5; stroke-linecap: round; }
      .opamp-body { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
      .term { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .junc { fill: #000000; }
      .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 19px; fill: #000000; }
      .math-up { font-family: 'Times New Roman', Times, Georgia, serif; font-style: normal; font-size: 19px; fill: #000000; }
      .sub-norm { font-size: 13px; font-style: normal; }
      .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Op Amp Triangle Symbol -->
  <polygon points="240,110 350,170 240,230" class="opamp-body"/>
  <text class="opamp-sign" x="254" y="139">−</text>
  <text class="opamp-sign" x="254" y="201">+</text>

  <!-- Inverting Input Branch (y = 140) -->
  <!-- Input Terminal -->
  <circle class="term" cx="60" cy="140" r="4.5"/>
  <line class="wire" x1="64.5" y1="140" x2="101" y2="140"/>

  <!-- Capacitor C -->
  <line class="cap-plate" x1="101" y1="126" x2="101" y2="154"/>
  <line class="cap-plate" x1="109" y1="126" x2="109" y2="154"/>
  <text class="math" x="105" y="116" text-anchor="middle">C</text>

  <!-- Wire between C and R1 -->
  <line class="wire" x1="109" y1="140" x2="145" y2="140"/>

  <!-- Resistor R1 -->
  <path class="wire" d="M 145,140 l 10,0 l 3.33,-9 l 6.67,18 l 6.67,-18 l 6.67,18 l 6.67,-18 l 6.67,18 l 3.33,-9 l 10,0"/>
  <text class="math" x="175" y="120" text-anchor="middle">R<tspan class="sub-norm" dy="4">1</tspan></text>

  <!-- Wire from R1 to Inverting Terminal -->
  <line class="wire" x1="205" y1="140" x2="240" y2="140"/>
  <circle class="junc" cx="205" cy="140" r="3.5"/>

  <!-- Feedback Path (R2) -->
  <line class="wire" x1="205" y1="140" x2="205" y2="65"/>
  <line class="wire" x1="205" y1="65" x2="255" y2="65"/>
  <path class="wire" d="M 255,65 l 10,0 l 3.33,-9 l 6.67,18 l 6.67,-18 l 6.67,18 l 6.67,-18 l 6.67,18 l 3.33,-9 l 10,0"/>
  <text class="math" x="285" y="48" text-anchor="middle">R<tspan class="sub-norm" dy="4">2</tspan></text>
  <line class="wire" x1="315" y1="65" x2="370" y2="65"/>
  <line class="wire" x1="370" y1="65" x2="370" y2="170"/>

  <!-- Noninverting Input Branch (y = 200) -->
  <line class="wire" x1="205" y1="200" x2="240" y2="200"/>
  <!-- Resistor R3 = R2 -->
  <path class="wire" d="M 145,200 l 10,0 l 3.33,-9 l 6.67,18 l 6.67,-18 l 6.67,18 l 6.67,-18 l 6.67,18 l 3.33,-9 l 10,0"/>
  <text class="math" x="175" y="228" text-anchor="middle">R<tspan class="sub-norm" dy="4">3</tspan><tspan class="math-up" dy="-4" dx="3"> = </tspan><tspan dx="3">R</tspan><tspan class="sub-norm" dy="4">2</tspan></text>
  <!-- Wire to Ground -->
  <line class="wire" x1="105" y1="200" x2="145" y2="200"/>
  <line class="wire" x1="105" y1="200" x2="105" y2="245"/>
  <!-- Ground Symbol -->
  <line class="wire" x1="91" y1="245" x2="119" y2="245"/>
  <line class="wire" x1="96" y1="250" x2="114" y2="250"/>
  <line class="wire" x1="101" y1="255" x2="109" y2="255"/>

  <!-- Output Terminal Branch (y = 170) -->
  <line class="wire" x1="350" y1="170" x2="415.5" y2="170"/>
  <circle class="junc" cx="370" cy="170" r="3.5"/>
  <circle class="term" cx="420" cy="170" r="4.5"/>
</svg>
