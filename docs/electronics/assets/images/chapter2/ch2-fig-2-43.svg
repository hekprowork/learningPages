<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="100%" role="img" aria-labelledby="title-2-43 desc-2-43">
  <title id="title-2-43">Figure 2.43 Noninverting Amplifier Saturation and Output Clipping</title>
  <desc id="desc-2-43">(a) Noninverting amplifier with a nominal gain of 10 V/V designed using an op amp saturating at ±13 V with ±20 mA output current limits. (b) Output waveform clipped at ±13 V when input peak is 1.5 V.</desc>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#111111"/>
    </marker>
    <marker id="arrow-sm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#111111"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-thin { fill: none; stroke: #111111; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dash { fill: none; stroke: #111111; stroke-width: 1.6; stroke-dasharray: 5,4; stroke-linecap: round; stroke-linejoin: round; }
    .wave-clipped { fill: none; stroke: #111111; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .wave-ideal { fill: none; stroke: #111111; stroke-width: 2.0; stroke-dasharray: 6,4; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #111111; }
    .txt-sm { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .math-sm { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 16px; fill: #111111; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .lbl-subfig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%"/>

  <!-- ========================================== -->
  <!-- Subfigure (a): Noninverting Amplifier      -->
  <!-- ========================================== -->
  <g id="subfig-a">
    <!-- Subfigure Label -->
    <text class="lbl-subfig" x="250" y="370">(a)</text>

    <!-- Small Input Sine Wave Graphic on the left -->
    <g id="input-waveform" transform="translate(30, 240)">
      <!-- Baseline axis -->
      <line class="wire-thin" x1="0" y1="20" x2="60" y2="20"/>
      <!-- Baseline label 0 -->
      <text class="txt-sm" x="-12" y="24">0</text>
      <!-- Peak dashed line -->
      <line class="wire-dash" x1="0" y1="5" x2="24" y2="5"/>
      <text class="math-sm" x="-20" y="8">V<tspan class="sub">p</tspan></text>
      <!-- Sine wave (one full cycle) -->
      <path class="wire-thin" d="M 5 20 C 11 0, 18 0, 24 20 C 30 40, 37 40, 43 20 C 47 12, 52 12, 56 20"/>
      <!-- Axis extension with arrow toward vI source -->
      <line class="wire-thin" x1="56" y1="20" x2="108" y2="20" marker-end="url(#arrow-sm)"/>
      <text class="math-sm" x="85" y="34">t</text>
    </g>

    <!-- Source vI -->
    <g id="source-vI">
      <!-- Connection from + input -->
      <path class="wire" d="M 230 205 L 195 205 L 195 240"/>
      <circle class="comp-bg" cx="195" cy="260" r="18"/>
      <text class="sign" x="195" y="251">+</text>
      <text class="sign" x="195" y="269">−</text>
      <text class="math" x="160" y="266">v<tspan class="sub">I</tspan></text>
      <!-- Ground below vI -->
      <line class="wire" x1="195" y1="278" x2="195" y2="295"/>
      <line class="wire" x1="183" y1="295" x2="207" y2="295"/>
      <line class="wire" x1="187" y1="300" x2="203" y2="300"/>
      <line class="wire" x1="191" y1="305" x2="199" y2="305"/>
    </g>

    <!-- Op Amp Triangle -->
    <path class="opamp-body" d="M 230 115 L 320 175 L 230 235 Z"/>
    <!-- Terminal signs inside op amp -->
    <text class="opamp-sign" x="244" y="145">−</text>
    <text class="opamp-sign" x="244" y="205">+</text>

    <!-- Feedback Network -->
    <!-- Inverting input wire to junction J1 -->
    <line class="wire" x1="230" y1="145" x2="185" y2="145"/>
    <circle class="junc" cx="185" cy="145" r="3.5"/>

    <!-- Resistor R1 to Ground (going left) -->
    <line class="wire" x1="185" y1="145" x2="160" y2="145"/>
    <!-- R1 Zigzag (width 40) -->
    <path class="wire" d="M 160 145 L 156 137 L 148 153 L 140 137 L 132 153 L 124 137 L 120 145"/>
    <line class="wire" x1="120" y1="145" x2="95" y2="145"/>
    <!-- Ground for R1 -->
    <line class="wire" x1="95" y1="145" x2="95" y2="162"/>
    <line class="wire" x1="83" y1="162" x2="107" y2="162"/>
    <line class="wire" x1="87" y1="167" x2="103" y2="167"/>
    <line class="wire" x1="91" y1="172" x2="99" y2="172"/>
    <!-- R1 Labels -->
    <text class="txt" x="140" y="125" text-anchor="middle">1 kΩ</text>
    <text class="math" x="140" y="172" text-anchor="middle">R<tspan class="sub">1</tspan></text>

    <!-- Feedback loop with R2 = 9 kΩ -->
    <line class="wire" x1="185" y1="145" x2="185" y2="85"/>
    <line class="wire" x1="185" y1="85" x2="230" y2="85"/>
    <!-- R2 Zigzag (width 50) -->
    <path class="wire" d="M 230 85 L 235 77 L 245 93 L 255 77 L 265 93 L 275 77 L 280 85"/>
    <line class="wire" x1="280" y1="85" x2="355" y2="85"/>
    <line class="wire" x1="355" y1="85" x2="355" y2="175"/>
    <!-- R2 Label -->
    <text class="math" x="255" y="65" text-anchor="middle">R<tspan class="sub">2</tspan> <tspan font-style="normal">= 9 kΩ</tspan></text>

    <!-- Op Amp Output Wire -->
    <line class="wire" x1="320" y1="175" x2="355" y2="175"/>
    <!-- Current io arrow -->
    <line class="wire-thin" x1="324" y1="160" x2="344" y2="160" marker-end="url(#arrow-sm)"/>
    <text class="math-sm" x="334" y="152" text-anchor="middle">i<tspan class="sub">o</tspan></text>

    <!-- Output Junction J2 -->
    <circle class="junc" cx="355" cy="175" r="3.5"/>

    <!-- Feedback current if arrow -->
    <line class="wire-thin" x1="368" y1="130" x2="368" y2="108" marker-end="url(#arrow-sm)"/>
    <text class="math-sm" x="378" y="122">i<tspan class="sub">F</tspan></text>

    <!-- Output Terminal vo -->
    <line class="wire" x1="355" y1="175" x2="410" y2="175"/>
    <circle class="term" cx="410" cy="175" r="4"/>
    <text class="math" x="424" y="181">v<tspan class="sub">O</tspan></text>

    <!-- Load branch with RL -->
    <line class="wire" x1="355" y1="175" x2="355" y2="210"/>
    <!-- Current iL arrow -->
    <line class="wire-thin" x1="368" y1="190" x2="368" y2="208" marker-end="url(#arrow-sm)"/>
    <text class="math-sm" x="378" y="202">i<tspan class="sub">L</tspan></text>
    <!-- RL Zigzag (height 40) -->
    <path class="wire" d="M 355 210 L 363 214 L 347 222 L 363 230 L 347 238 L 363 246 L 355 250"/>
    <line class="wire" x1="355" y1="250" x2="355" y2="275"/>
    <!-- RL Label -->
    <text class="math" x="375" y="234">R<tspan class="sub">L</tspan></text>
    <!-- Ground for RL -->
    <line class="wire" x1="343" y1="275" x2="367" y2="275"/>
    <line class="wire" x1="347" y1="280" x2="363" y2="280"/>
    <line class="wire" x1="351" y1="285" x2="359" y2="285"/>
  </g>

  <!-- ========================================== -->
  <!-- Subfigure (b): Clipped Sine Waveform       -->
  <!-- ========================================== -->
  <g id="subfig-b">
    <!-- Subfigure Label -->
    <text class="lbl-subfig" x="690" y="370">(b)</text>

    <!-- Axes -->
    <!-- Vertical axis (vO) -->
    <line class="wire-thin" x1="570" y1="320" x2="570" y2="60" marker-end="url(#arrow)"/>
    <text class="math" x="548" y="66">v<tspan class="sub">O</tspan></text>

    <!-- Horizontal axis (t) -->
    <line class="wire-thin" x1="540" y1="180" x2="810" y2="180" marker-end="url(#arrow)"/>
    <text class="math" x="812" y="195">t</text>
    <text class="txt" x="556" y="200">0</text>

    <!-- Reference Level Dashed Lines and Labels -->
    <!-- +15 V Level (y = 80) -->
    <line class="wire-dash" x1="626" y1="80" x2="720" y2="80"/>
    <text class="txt" x="726" y="85">15 V</text>

    <!-- +13 V Level (y = 96) -->
    <line class="wire-dash" x1="626" y1="96" x2="720" y2="96"/>
    <text class="txt" x="726" y="101">13 V</text>

    <!-- -13 V Level (y = 264) -->
    <line class="wire-dash" x1="626" y1="264" x2="720" y2="264"/>
    <text class="txt" x="620" y="269" text-anchor="end">− 13 V</text>

    <!-- -15 V Level (y = 280) -->
    <line class="wire-dash" x1="626" y1="280" x2="720" y2="280"/>
    <text class="txt" x="620" y="285" text-anchor="end">− 15 V</text>

    <!-- Clipped Output Waveform -->
    <!-- Actual clipped output path (Solid line) -->
    <path class="wave-clipped" d="
      M 615 180
      C 623 145, 630 115, 636 96
      L 674 96
      C 680 115, 687 145, 695 180
      C 703 215, 710 245, 716 264
      L 754 264
      C 760 245, 767 215, 775 180
      L 780 160
    "/>

    <!-- Unclipped ideal peaks (Dashed lines) -->
    <!-- Positive peak extending to 15 V -->
    <path class="wave-ideal" d="
      M 636 96
      C 642 82, 648 80, 655 80
      C 662 80, 668 82, 674 96
    "/>

    <!-- Negative peak extending to -15 V -->
    <path class="wave-ideal" d="
      M 716 264
      C 722 278, 728 280, 735 280
      C 742 280, 748 278, 754 264
    "/>
  </g>
</svg>
