<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" role="img" aria-labelledby="title-2-45 desc-2-45">
  <title id="title-2-45">Figure 2.45 Effect of Slew-Rate Limiting on Output Sinusoidal Waveforms</title>
  <desc id="desc-2-45">Comparison between the theoretical sinusoidal output voltage and the triangular slew-rate limited output waveform.</desc>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#111111"/>
    </marker>
    <marker id="arrow-sm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#111111"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .axis { fill: none; stroke: #111111; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .wave-ideal { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wave-sr { fill: none; stroke: #111111; stroke-width: 2.2; stroke-dasharray: 6,4; stroke-linecap: round; stroke-linejoin: round; }
    .callout-line { fill: none; stroke: #111111; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .txt-center { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; text-anchor: middle; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
  </style>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%"/>

  <!-- Horizontal Axis (t) passing through the center line -->
  <line class="axis" x1="140" y1="190" x2="680" y2="190" marker-end="url(#arrow)"/>
  <text class="math" x="686" y="196">t</text>

  <!-- Theoretical Output Waveform (Smooth Sine Wave, Solid line) -->
  <path class="wave-ideal" d="
    M 175 145
    C 185 162, 190 176, 195 190
    C 205 228, 215 265, 230 265
    C 245 265, 255 228, 295 190
    C 335 152, 345 115, 360 115
    C 375 115, 385 152, 425 190
    C 465 228, 475 265, 490 265
    C 505 265, 515 228, 555 190
    C 595 152, 605 115, 620 115
    C 635 115, 645 152, 665 205
  "/>

  <!-- Slew-Rate Limited Output Waveform (Triangular Ramp, Dashed line) -->
  <path class="wave-sr" d="
    M 195 195
    L 230 265
    L 360 115
    L 490 265
    L 620 115
    L 665 210
  "/>

  <!-- Callout 1: Theoretical output -->
  <g id="callout-theoretical">
    <text class="txt-center" x="355" y="40">Theoretical</text>
    <text class="txt-center" x="355" y="58">output</text>
    <!-- Arrow pointing to the first sine peak -->
    <path class="callout-line" d="M 335 68 L 305 112" marker-end="url(#arrow-sm)"/>
  </g>

  <!-- Callout 2: Output when op amp is slew-rate limited -->
  <g id="callout-sr">
    <text class="txt-center" x="510" y="85">Output when op amp</text>
    <text class="txt-center" x="510" y="103">is slew-rate limited</text>
    <!-- Arrow pointing to the slew-rate limited rising ramp -->
    <path class="callout-line" d="M 465 112 L 435 175" marker-end="url(#arrow-sm)"/>
  </g>
</svg>
