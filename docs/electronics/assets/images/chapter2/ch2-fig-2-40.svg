<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="100%">
  <title>Figure 2.40 Open-loop gain of a typical general-purpose, internally compensated op amp</title>
  <desc>Bode magnitude plot showing the open-loop gain |A| in dB versus frequency f in Hz for an internally compensated op amp, highlighting dc gain A0 (106 dB), corner frequency fb (10 Hz), -20 dB/decade (-6 dB/octave) rolloff, 3 dB drop at corner, and unity-gain frequency ft (10^6 Hz).</desc>

  <defs>
    <!-- Arrow marker for axes -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <!-- Arrow marker for annotations -->
    <marker id="annot-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Graph elements container -->
  <g id="figure-2-40" transform="translate(40, 20)">

    <!-- Axes -->
    <!-- X Axis: from x=160 to 600 -->
    <line x1="160" y1="380" x2="600" y2="380" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Y Axis: from y=380 up to 30 -->
    <line x1="160" y1="380" x2="160" y2="35" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Axis Labels -->
    <!-- Y Axis Label: |A| (dB) -->
    <text x="160" y="24" font-family="'Times New Roman', Times, serif" font-size="19" font-style="italic" text-anchor="middle" fill="#000000">|A|<tspan font-style="normal"> (dB)</tspan></text>
    <!-- X Axis Label: f (Hz) -->
    <text x="590" y="405" font-family="'Times New Roman', Times, serif" font-size="19" font-style="italic" text-anchor="middle" fill="#000000">f<tspan font-style="normal"> (Hz)</tspan></text>

    <!-- Y-axis Ticks and Values -->
    <!-- 0 dB -->
    <line x1="154" y1="380" x2="160" y2="380" stroke="#000000" stroke-width="1.5" />
    <text x="150" y="386" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="end" fill="#000000">0</text>

    <!-- 20 dB -->
    <line x1="154" y1="324" x2="160" y2="324" stroke="#000000" stroke-width="1.5" />
    <text x="150" y="330" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="end" fill="#000000">20</text>

    <!-- 40 dB -->
    <line x1="154" y1="268" x2="160" y2="268" stroke="#000000" stroke-width="1.5" />
    <text x="150" y="274" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="end" fill="#000000">40</text>

    <!-- 60 dB -->
    <line x1="154" y1="212" x2="160" y2="212" stroke="#000000" stroke-width="1.5" />
    <text x="150" y="218" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="end" fill="#000000">60</text>

    <!-- 80 dB -->
    <line x1="154" y1="156" x2="160" y2="156" stroke="#000000" stroke-width="1.5" />
    <text x="150" y="162" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="end" fill="#000000">80</text>

    <!-- 100 dB -->
    <line x1="154" y1="100" x2="160" y2="100" stroke="#000000" stroke-width="1.5" />
    <text x="150" y="106" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="end" fill="#000000">100</text>

    <!-- X-axis Ticks and Values -->
    <!-- 10 (fb) at x = 210 -->
    <line x1="210" y1="380" x2="210" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="210" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10</text>

    <!-- 10^2 at x = 266 -->
    <line x1="266" y1="380" x2="266" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="266" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10<tspan font-size="12" dy="-7">2</tspan></text>

    <!-- 10^3 at x = 322 -->
    <line x1="322" y1="380" x2="322" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="322" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10<tspan font-size="12" dy="-7">3</tspan></text>

    <!-- 10^4 at x = 378 -->
    <line x1="378" y1="380" x2="378" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="378" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10<tspan font-size="12" dy="-7">4</tspan></text>

    <!-- 10^5 at x = 434 -->
    <line x1="434" y1="380" x2="434" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="434" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10<tspan font-size="12" dy="-7">5</tspan></text>

    <!-- 10^6 (ft) at x = 490 -->
    <line x1="490" y1="380" x2="490" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="490" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10<tspan font-size="12" dy="-7">6</tspan></text>

    <!-- 10^7 at x = 546 -->
    <line x1="546" y1="380" x2="546" y2="373" stroke="#000000" stroke-width="1.5" />
    <text x="546" y="402" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">10<tspan font-size="12" dy="-7">7</tspan></text>

    <!-- Dashed Reference Lines -->
    <!-- Vertical dashed line from corner frequency 10 Hz (x=210) up to asymptote y=83.2 -->
    <line x1="210" y1="373" x2="210" y2="83.2" stroke="#000000" stroke-width="1.2" stroke-dasharray="6,4" />

    <!-- Gain curve: actual frequency response (smooth curve transitioning to -20 dB/dec) -->
    <!-- From x=160, y=83.2 (106 dB), corner at x=210 where actual is y=91.6 (103 dB), asymptoting into line to (490, 380) -->
    <path d="M 160 83.2 L 180 83.5 C 196 84.5 204 88.0 210 91.6 C 218 96.5 228 107.0 240 123.0 L 530 423" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />

    <!-- Asymptotes (horizontal line from y=83.2 extending past x=210 to x=265) -->
    <line x1="210" y1="83.2" x2="265" y2="83.2" stroke="#000000" stroke-width="1" />
    <!-- 3 dB level horizontal line at y=91.6 extending to x=265 -->
    <line x1="210" y1="91.6" x2="265" y2="91.6" stroke="#000000" stroke-width="1" />

    <!-- 3 dB Double-headed vertical dimension line between y=83.2 and y=91.6 at x=260 -->
    <line x1="260" y1="83.2" x2="260" y2="60" stroke="#000000" stroke-width="1" />
    <line x1="260" y1="91.6" x2="260" y2="115" stroke="#000000" stroke-width="1" />
    <path d="M 260 77 L 260 83.2" stroke="#000000" stroke-width="1" marker-end="url(#annot-arrow)" />
    <path d="M 260 98 L 260 91.6" stroke="#000000" stroke-width="1" marker-end="url(#annot-arrow)" />
    <text x="274" y="93" font-family="'Times New Roman', Times, serif" font-size="16" fill="#000000">3 dB</text>

    <!-- A0 label and arrow pointing to y=83.2 on Y-axis -->
    <text x="65" y="105" font-family="'Times New Roman', Times, serif" font-size="20" font-style="italic" fill="#000000">A<tspan font-size="14" dy="4">0</tspan></text>
    <line x1="95" y1="102" x2="135" y2="102" stroke="#000000" stroke-width="1.3" marker-end="url(#annot-arrow)" />

    <!-- fb label and arrow pointing up to x=210 on X-axis -->
    <line x1="210" y1="445" x2="210" y2="422" stroke="#000000" stroke-width="1.3" marker-end="url(#annot-arrow)" />
    <text x="210" y="468" font-family="'Times New Roman', Times, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#000000">f<tspan font-size="14" dy="4">b</tspan></text>

    <!-- ft label and arrow pointing up to x=490 on X-axis -->
    <line x1="490" y1="445" x2="490" y2="422" stroke="#000000" stroke-width="1.3" marker-end="url(#annot-arrow)" />
    <text x="490" y="490" font-family="'Times New Roman', Times, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#000000">f<tspan font-size="14" dy="4">t</tspan></text>

    <!-- Slope annotations: -20 dB/decade or -6 dB/octave -->
    <text x="475" y="185" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">&#x2212;20 dB/decade</text>
    <text x="475" y="206" font-family="'Times New Roman', Times, serif" font-size="15" text-anchor="middle" fill="#000000">or</text>
    <text x="475" y="228" font-family="'Times New Roman', Times, serif" font-size="16" text-anchor="middle" fill="#000000">&#x2212;6 dB/octave</text>

    <!-- Curved / angled arrow from slope text to curve -->
    <path d="M 430 220 C 405 220 380 226 368 238" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#annot-arrow)" />

  </g>
</svg>
