<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="100%" height="100%" role="img" aria-labelledby="title-2-18 desc-2-18">
  <title id="title-2-18">Figure 2.18 Common-Mode Gain Analysis of Difference Amplifier</title>
  <desc id="desc-2-18">Analysis of the difference amplifier circuit to determine its common-mode gain Acm = vO / vIcm showing input currents and node voltages.</desc>
  
  <style>
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dash { fill: none; stroke: #111111; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5,4; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .math-bold { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-weight: bold; font-size: 20px; fill: #111111; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: bold; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .lbl-subfig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; }
    .arrow { fill: #111111; }
    .arrow-line { fill: none; stroke: #111111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Ground and vIcm source on left -->
  
    <line class="wire" x1="90" y1="275" x2="90" y2="285"/>
    <line class="wire" x1="76" y1="285" x2="104" y2="285"/>
    <line class="wire" x1="81" y1="290" x2="99" y2="290"/>
    <line class="wire" x1="86" y1="295" x2="94" y2="295"/>
    
  <line class="wire" x1="90" y1="275" x2="90" y2="252"/>
  <circle class="comp-bg" cx="90" cy="230" r="22"/>
  <text class="sign" x="90" y="220">+</text>
  <text class="sign" x="90" y="241">−</text>
  <text class="math" x="28" y="236">v<tspan class="sub">Icm</tspan></text>

  <!-- Wire from source up and branch -->
  <path class="wire" d="M 90 208 L 90 175 L 140 175"/>
  <circle class="junc" cx="140" cy="175" r="3.5"/>
  <path class="wire" d="M 140 175 L 140 140 L 175 140"/>
  <path class="wire" d="M 140 175 L 140 210 L 175 210"/>

  <!-- Resistor R1 with current i1 -->
  <path class="wire" d="M 175.0,140.0 L 187.0,140.0 L 190.8,130.0 L 198.5,150.0 L 206.2,130.0 L 213.8,150.0 L 221.5,130.0 L 229.2,150.0 L 233.0,140.0 L 245.0,140.0"/>
  <line class="wire" x1="245" y1="140" x2="310" y2="140"/>
  <text class="math" x="200" y="116">R<tspan class="sub-norm">1</tspan></text>
  <!-- current i1 arrow -->
  <line class="arrow-line" x1="160" y1="120" x2="195" y2="120" marker-end="url(#arrow-head)"/>
  <text class="math" x="170" y="112">i<tspan class="sub-norm">1</tspan></text>

  <!-- Resistor R3 -->
  <path class="wire" d="M 175.0,210.0 L 187.0,210.0 L 190.8,200.0 L 198.5,220.0 L 206.2,200.0 L 213.8,220.0 L 221.5,200.0 L 229.2,220.0 L 233.0,210.0 L 245.0,210.0"/>
  <line class="wire" x1="245" y1="210" x2="310" y2="210"/>
  <text class="math" x="200" y="238">R<tspan class="sub-norm">3</tspan></text>

  <!-- Nodes at inputs -->
  <circle class="junc" cx="280" cy="140" r="3.5"/>
  <circle class="junc" cx="280" cy="210" r="3.5"/>

  <!-- Feedback R2 with current i2 -->
  <path class="wire" d="M 280 140 L 280 75 L 340 75"/>
  <path class="wire" d="M 340.0,75.0 L 352.0,75.0 L 356.2,65.0 L 364.8,85.0 L 373.2,65.0 L 381.8,85.0 L 390.2,65.0 L 398.8,85.0 L 403.0,75.0 L 415.0,75.0"/>
  <path class="wire" d="M 415 75 L 470 75 L 470 175"/>
  <text class="math" x="370" y="58">R<tspan class="sub-norm">2</tspan></text>
  <!-- current i2 arrow -->
  <line class="arrow-line" x1="290" y1="60" x2="330" y2="60" marker-end="url(#arrow-head)"/>
  <text class="math" x="305" y="52">i<tspan class="sub-norm">2</tspan></text>

  <!-- Op-amp -->
  
    <polygon points="310,133.0 385,175 310,217.0" class="opamp-body"/>
    <text class="opamp-sign" x="322" y="153">−</text>
    <text class="opamp-sign" x="322" y="197">+</text>
    

  <!-- R4 to ground -->
  <line class="wire" x1="280" y1="210" x2="280" y2="235"/>
  <path class="wire" d="M 280.0,235.0 L 280.0,247.0 L 270.0,250.4 L 290.0,257.2 L 270.0,264.1 L 290.0,270.9 L 270.0,277.8 L 290.0,284.6 L 280.0,288.0 L 280.0,300.0"/>
  <line class="wire" x1="280" y1="300" x2="280" y2="320"/>
  <text class="math" x="298" y="272">R<tspan class="sub-norm">4</tspan></text>
  
    <line class="wire" x1="280" y1="320" x2="280" y2="330"/>
    <line class="wire" x1="266" y1="330" x2="294" y2="330"/>
    <line class="wire" x1="271" y1="335" x2="289" y2="335"/>
    <line class="wire" x1="276" y1="340" x2="284" y2="340"/>
    

  <!-- Formula annotation pointing to (+) and (-) inputs -->
  <g transform="translate(130, 290)">
    <text class="math" x="0" y="0"><tspan font-style="normal">[</tspan>R<tspan class="sub-norm">4</tspan> / (R<tspan class="sub-norm">4</tspan> + R<tspan class="sub-norm">3</tspan>)<tspan font-style="normal">]</tspan> v<tspan class="sub">Icm</tspan></text>
    <!-- Pointer to (-) node -->
    <path class="arrow-line" d="M 105 -15 C 130 -60 210 -100 276 -142" marker-end="url(#arrow-head)"/>
    <!-- Pointer to (+) node -->
    <path class="arrow-line" d="M 105 -15 C 150 -35 220 -60 276 -74" marker-end="url(#arrow-head)"/>
  </g>

  <!-- Output -->
  <line class="wire" x1="385" y1="175" x2="520" y2="175"/>
  <circle class="junc" cx="470" cy="175" r="3.5"/>
  <circle class="term" cx="520" cy="175" r="4.5"/>
  <text class="math" x="532" y="181">v<tspan class="sub-norm">O</tspan></text>
</svg>