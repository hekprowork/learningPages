<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%" role="img" aria-labelledby="title-2-32 desc-2-32">
  <title id="title-2-32">Figure 2.32 Capacitively Coupled Inverting Amplifier and Its DC Offset Equivalent Circuit</title>
  <desc id="desc-2-32">(a) A capacitively coupled inverting amplifier with series capacitor C and resistor R1. (b) The equivalent circuit at dc for determining its output offset voltage Vo = Vos.</desc>

  <style>
    .wire { fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .opamp-body { fill: #ffffff; stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .term { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .junc { fill: #000000; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #000000; }
    .subfig-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 19px; fill: #000000; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: normal; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .arrow { fill: #000000; }
    .arrow-line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow"/>
    </marker>
  </defs>

  <!-- Clean pure white background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ========================================== -->
  <!-- SUBFIGURE (a): Capacitively coupled inverting amplifier -->
  <!-- ========================================== -->
  <g id="subfig-a">
    <!-- Input terminal and capacitor C -->
    <circle class="term" cx="50" cy="150" r="4.5"/>
    <line class="wire" x1="55" y1="150" x2="80" y2="150"/>
    
    <!-- Capacitor C plates -->
    <line class="wire" x1="80" y1="136" x2="80" y2="164"/>
    <line class="wire" x1="88" y1="136" x2="88" y2="164"/>
    <line class="wire" x1="88" y1="150" x2="110" y2="150"/>
    <text class="math" x="84" y="126" text-anchor="middle">C</text>

    <!-- Resistor R1 -->
    <path class="wire" d="M 110,150 l 5,0 l 3.33,-8 l 6.67,16 l 6.67,-16 l 6.67,16 l 6.67,-16 l 6.67,16 l 3.33,-8 l 5,0"/>
    <text class="math" x="135" y="132" text-anchor="middle">R<tspan class="sub-norm">1</tspan></text>

    <!-- Wire from R1 to Inverting Input Node -->
    <line class="wire" x1="160" y1="150" x2="220" y2="150"/>
    <circle class="junc" cx="180" cy="150" r="3.5"/>

    <!-- Feedback Path (R2) -->
    <line class="wire" x1="180" y1="150" x2="180" y2="75"/>
    <line class="wire" x1="180" y1="75" x2="215" y2="75"/>
    <!-- R2 zigzag -->
    <path class="wire" d="M 215,75 l 5,0 l 3.33,-8 l 6.67,16 l 6.67,-16 l 6.67,16 l 6.67,-16 l 6.67,16 l 3.33,-8 l 5,0"/>
    <text class="math" x="240" y="58" text-anchor="middle">R<tspan class="sub-norm">2</tspan></text>
    <line class="wire" x1="265" y1="75" x2="300" y2="75"/>
    <line class="wire" x1="300" y1="75" x2="300" y2="175"/>

    <!-- Op-Amp Triangle -->
    <polygon points="220,120 220,230 310,175" class="opamp-body"/>
    <text class="opamp-sign" x="232" y="150">−</text>
    <text class="opamp-sign" x="232" y="200">+</text>

    <!-- Non-inverting input grounded -->
    <line class="wire" x1="220" y1="200" x2="180" y2="200"/>
    <line class="wire" x1="180" y1="200" x2="180" y2="225"/>
    <!-- Ground symbol -->
    <line class="wire" x1="166" y1="225" x2="194" y2="225"/>
    <line class="wire" x1="171" y1="230" x2="189" y2="230"/>
    <line class="wire" x1="176" y1="235" x2="184" y2="235"/>

    <!-- Output Connection -->
    <line class="wire" x1="310" y1="175" x2="340" y2="175"/>
    <circle class="junc" cx="300" cy="175" r="3.5"/>
    <circle class="term" cx="340" cy="175" r="4.5"/>

    <!-- Subfigure Caption -->
    <text class="subfig-lbl" x="195" y="280" text-anchor="middle">(a)</text>
  </g>

  <!-- ========================================== -->
  <!-- SUBFIGURE (b): Equivalent circuit for DC offset -->
  <!-- ========================================== -->
  <g id="subfig-b">
    <!-- Feedback Path (R2) directly from inverting terminal -->
    <line class="wire" x1="520" y1="150" x2="480" y2="150"/>
    <line class="wire" x1="480" y1="150" x2="480" y2="75"/>
    <line class="wire" x1="480" y1="75" x2="515" y2="75"/>
    <!-- R2 zigzag -->
    <path class="wire" d="M 515,75 l 5,0 l 3.33,-8 l 6.67,16 l 6.67,-16 l 6.67,16 l 6.67,-16 l 6.67,16 l 3.33,-8 l 5,0"/>
    <text class="math" x="540" y="58" text-anchor="middle">R<tspan class="sub-norm">2</tspan></text>
    <line class="wire" x1="565" y1="75" x2="600" y2="75"/>
    <line class="wire" x1="600" y1="75" x2="600" y2="175"/>

    <!-- Non-inverting input with DC offset voltage source Vos -->
    <line class="wire" x1="520" y1="200" x2="488" y2="200"/>
    <!-- Vos Source Circle -->
    <circle class="comp-bg" cx="470" cy="200" r="18"/>
    <text class="sign" x="461" y="200">−</text>
    <text class="sign" x="479" y="200">+</text>
    <text class="math" x="470" y="235" text-anchor="middle">V<tspan class="sub">OS</tspan></text>

    <!-- Wire from Vos to ground -->
    <line class="wire" x1="452" y1="200" x2="430" y2="200"/>
    <line class="wire" x1="430" y1="200" x2="430" y2="225"/>
    <!-- Ground symbol -->
    <line class="wire" x1="416" y1="225" x2="444" y2="225"/>
    <line class="wire" x1="421" y1="230" x2="439" y2="230"/>
    <line class="wire" x1="426" y1="235" x2="434" y2="235"/>

    <!-- Op-Amp Triangle -->
    <polygon points="520,120 520,230 610,175" class="opamp-body"/>
    <text class="opamp-sign" x="532" y="150">−</text>
    <text class="opamp-sign" x="532" y="200">+</text>

    <!-- Offset Free indicator -->
    <text class="txt" x="592" y="248">Offset free</text>
    <line class="arrow-line" x1="585" y1="242" x2="552" y2="218" marker-end="url(#arrowhead)"/>

    <!-- Output Connection -->
    <line class="wire" x1="610" y1="175" x2="640" y2="175"/>
    <circle class="junc" cx="600" cy="175" r="3.5"/>
    <circle class="term" cx="640" cy="175" r="4.5"/>
    <text class="math" x="652" y="180">V<tspan class="sub-norm">O</tspan> = V<tspan class="sub">OS</tspan></text>

    <!-- Subfigure Caption -->
    <text class="subfig-lbl" x="565" y="280" text-anchor="middle">(b)</text>
  </g>
</svg>
