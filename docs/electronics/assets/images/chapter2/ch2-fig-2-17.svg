<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="100%" height="100%" role="img" aria-labelledby="title-2-17 desc-2-17">
  <title id="title-2-17">Figure 2.17 Application of Superposition to the Analysis of the Difference Amplifier</title>
  <desc id="desc-2-17">Superposition analysis of the difference amplifier circuit: (a) evaluating the output component vO1 due to input vI1 with vI2 grounded; (b) evaluating the output component vO2 due to input vI2 with vI1 grounded.</desc>
  
  <style>
    .wire { fill: none; stroke: #111111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire-dash { fill: none; stroke: #111111; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5,4; }
    .opamp-body { fill: #ffffff; stroke: #111111; stroke-width: 2.2; stroke-linejoin: round; }
    .comp-bg { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .term { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
    .junc { fill: #111111; }
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #111111; }
    .math { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-size: 20px; fill: #111111; }
    .math-bold { font-family: 'Times New Roman', Times, Georgia, serif; font-style: italic; font-weight: bold; font-size: 20px; fill: #111111; }
    .sub { font-size: 0.72em; font-style: italic; }
    .sub-norm { font-size: 0.72em; font-style: normal; }
    .opamp-sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .sign { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: bold; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    .lbl-subfig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #111111; text-anchor: middle; }
    .arrow { fill: #111111; }
    .arrow-line { fill: none; stroke: #111111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- SUBFIGURE (a): Left side -->
  <g transform="translate(0, 0)">
    <!-- Input vI1 -->
    <circle class="term" cx="65" cy="140" r="4.5"/>
    <text class="math" x="22" y="146">v<tspan class="sub">I1</tspan></text>

    <!-- Resistor R1 -->
    <line class="wire" x1="70" y1="140" x2="95" y2="140"/>
    <path class="wire" d="M 95.0,140.0 L 107.0,140.0 L 110.4,130.0 L 117.2,150.0 L 124.1,130.0 L 130.9,150.0 L 137.8,130.0 L 144.6,150.0 L 148.0,140.0 L 160.0,140.0"/>
    <line class="wire" x1="160" y1="140" x2="220" y2="140"/>
    <text class="math" x="120" y="120">R<tspan class="sub-norm">1</tspan></text>
    <circle class="junc" cx="185" cy="140" r="3.5"/>

    <!-- Feedback R2 -->
    <path class="wire" d="M 185 140 L 185 75 L 235 75"/>
    <path class="wire" d="M 235.0,75.0 L 247.0,75.0 L 250.4,65.0 L 257.2,85.0 L 264.1,65.0 L 270.9,85.0 L 277.8,65.0 L 284.6,85.0 L 288.0,75.0 L 300.0,75.0"/>
    <path class="wire" d="M 300 75 L 345 75 L 345 175"/>
    <text class="math" x="260" y="60">R<tspan class="sub-norm">2</tspan></text>

    <!-- Op-amp -->
    
    <polygon points="220,135.0 290,175 220,215.0" class="opamp-body"/>
    <text class="opamp-sign" x="232" y="153">−</text>
    <text class="opamp-sign" x="232" y="197">+</text>
    

    <!-- Non-inverting input with R3 and R4 in parallel to ground -->
    <path class="wire" d="M 220 197 L 185 197"/>
    <circle class="junc" cx="185" cy="197" r="3.5"/>
    <!-- R3 branch -->
    <path class="wire" d="M 185 197 L 135 197 L 135 230"/>
    <path class="wire" d="M 135.0,230.0 L 135.0,242.0 L 125.0,245.0 L 145.0,251.0 L 125.0,257.0 L 145.0,263.0 L 125.0,269.0 L 145.0,275.0 L 135.0,278.0 L 135.0,290.0"/>
    <line class="wire" x1="135" y1="290" x2="135" y2="305"/>
    <text class="math" x="148" y="265">R<tspan class="sub-norm">3</tspan></text>
    
    <line class="wire" x1="135" y1="305" x2="135" y2="315"/>
    <line class="wire" x1="121" y1="315" x2="149" y2="315"/>
    <line class="wire" x1="126" y1="320" x2="144" y2="320"/>
    <line class="wire" x1="131" y1="325" x2="139" y2="325"/>
    

    <!-- R4 branch -->
    <line class="wire" x1="185" y1="197" x2="185" y2="230"/>
    <path class="wire" d="M 185.0,230.0 L 185.0,242.0 L 175.0,245.0 L 195.0,251.0 L 175.0,257.0 L 195.0,263.0 L 175.0,269.0 L 195.0,275.0 L 185.0,278.0 L 185.0,290.0"/>
    <line class="wire" x1="185" y1="290" x2="185" y2="305"/>
    <text class="math" x="198" y="265">R<tspan class="sub-norm">4</tspan></text>
    
    <line class="wire" x1="185" y1="305" x2="185" y2="315"/>
    <line class="wire" x1="171" y1="315" x2="199" y2="315"/>
    <line class="wire" x1="176" y1="320" x2="194" y2="320"/>
    <line class="wire" x1="181" y1="325" x2="189" y2="325"/>
    

    <!-- Output -->
    <line class="wire" x1="290" y1="175" x2="395" y2="175"/>
    <circle class="junc" cx="345" cy="175" r="3.5"/>
    <circle class="term" cx="395" cy="175" r="4.5"/>
    <text class="math" x="406" y="181">v<tspan class="sub">O1</tspan></text>

    <!-- Label (a) -->
    <text class="lbl-subfig" x="220" y="375">(a)</text>
  </g>

  <!-- SUBFIGURE (b): Right side -->
  <g transform="translate(440, 0)">
    <!-- Inverting input connected to R1 to ground -->
    <line class="wire" x1="115" y1="140" x2="85" y2="140"/>
    
    <line class="wire" x1="85" y1="140" x2="85" y2="150"/>
    <line class="wire" x1="71" y1="150" x2="99" y2="150"/>
    <line class="wire" x1="76" y1="155" x2="94" y2="155"/>
    <line class="wire" x1="81" y1="160" x2="89" y2="160"/>
    
    <path class="wire" d="M 115.0,140.0 L 127.0,140.0 L 130.4,130.0 L 137.2,150.0 L 144.1,130.0 L 150.9,150.0 L 157.8,130.0 L 164.6,150.0 L 168.0,140.0 L 180.0,140.0"/>
    <line class="wire" x1="180" y1="140" x2="240" y2="140"/>
    <text class="math" x="140" y="120">R<tspan class="sub-norm">1</tspan></text>
    <circle class="junc" cx="205" cy="140" r="3.5"/>

    <!-- Feedback R2 -->
    <path class="wire" d="M 205 140 L 205 75 L 255 75"/>
    <path class="wire" d="M 255.0,75.0 L 267.0,75.0 L 270.4,65.0 L 277.2,85.0 L 284.1,65.0 L 290.9,85.0 L 297.8,65.0 L 304.6,85.0 L 308.0,75.0 L 320.0,75.0"/>
    <path class="wire" d="M 320 75 L 365 75 L 365 175"/>
    <text class="math" x="280" y="60">R<tspan class="sub-norm">2</tspan></text>

    <!-- Op-amp -->
    
    <polygon points="240,135.0 310,175 240,215.0" class="opamp-body"/>
    <text class="opamp-sign" x="252" y="153">−</text>
    <text class="opamp-sign" x="252" y="197">+</text>
    

    <!-- Input vI2 through R3 to non-inv input -->
    <circle class="term" cx="85" cy="210" r="4.5"/>
    <text class="math" x="42" y="216">v<tspan class="sub">I2</tspan></text>
    <line class="wire" x1="90" y1="210" x2="115" y2="210"/>
    <path class="wire" d="M 115.0,210.0 L 127.0,210.0 L 130.4,200.0 L 137.2,220.0 L 144.1,200.0 L 150.9,220.0 L 157.8,200.0 L 164.6,220.0 L 168.0,210.0 L 180.0,210.0"/>
    <line class="wire" x1="180" y1="210" x2="240" y2="210"/>
    <text class="math" x="140" y="192">R<tspan class="sub-norm">3</tspan></text>
    <circle class="junc" cx="205" cy="210" r="3.5"/>

    <!-- R4 to ground -->
    <line class="wire" x1="205" y1="210" x2="205" y2="235"/>
    <path class="wire" d="M 205.0,235.0 L 205.0,247.0 L 195.0,250.0 L 215.0,256.0 L 195.0,262.0 L 215.0,268.0 L 195.0,274.0 L 215.0,280.0 L 205.0,283.0 L 205.0,295.0"/>
    <line class="wire" x1="205" y1="295" x2="205" y2="310"/>
    <text class="math" x="220" y="270">R<tspan class="sub-norm">4</tspan></text>
    
    <line class="wire" x1="205" y1="310" x2="205" y2="320"/>
    <line class="wire" x1="191" y1="320" x2="219" y2="320"/>
    <line class="wire" x1="196" y1="325" x2="214" y2="325"/>
    <line class="wire" x1="201" y1="330" x2="209" y2="330"/>
    

    <!-- Output -->
    <line class="wire" x1="310" y1="175" x2="415" y2="175"/>
    <circle class="junc" cx="365" cy="175" r="3.5"/>
    <circle class="term" cx="415" cy="175" r="4.5"/>
    <text class="math" x="426" y="181">v<tspan class="sub">O2</tspan></text>

    <!-- Label (b) -->
    <text class="lbl-subfig" x="240" y="375">(b)</text>
  </g>
</svg>