<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" height="100%">
  <title>Figure 2.38 Determining the effect of the op-amp input offset voltage Vos on the Miller integrator circuit</title>
  <desc>Schematic showing the Miller integrator circuit driven by the op-amp input offset voltage Vos connected to the non-inverting terminal, with input grounded through resistor R, feedback capacitor C, current directions, and output voltage equation vo = Vos + (Vos / CR) * t.</desc>

  <defs>
    <!-- Arrow marker for current indicators -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Global circuit styling -->
  <g stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Op-Amp Triangle -->
    <!-- Inverting input at (180, 85), Non-inverting input at (180, 135), Output apex at (255, 110) -->
    <polygon points="180,60 180,160 255,110" fill="#ffffff" stroke-width="2" />

    <!-- Inverting (-) Input Lead & Path -->
    <line x1="140" y1="85" x2="180" y2="85" />

    <!-- Resistor R: from x=80 to x=140 at y=85 -->
    <line x1="80" y1="85" x2="86" y2="85" />
    <path d="M 86,85 L 90,77 L 98,93 L 106,77 L 114,93 L 122,77 L 130,93 L 134,85" />
    <line x1="134" y1="85" x2="140" y2="85" />

    <!-- Ground at Resistor Left: (80, 85) down to (80, 105) -->
    <line x1="80" y1="85" x2="80" y2="105" />
    <line x1="70" y1="105" x2="90" y2="105" stroke-width="2.5" />
    <line x1="74" y1="110" x2="86" y2="110" stroke-width="2" />
    <line x1="78" y1="115" x2="82" y2="115" stroke-width="1.5" />

    <!-- Feedback Capacitor Loop -->
    <!-- From node (160, 85) up to y=45, across through capacitor C, and down to output line (275, 110) -->
    <line x1="160" y1="85" x2="160" y2="45" />
    <line x1="160" y1="45" x2="216" y2="45" />
    <!-- Capacitor C plates at x=216 and x=224, height 26 (y=32 to y=58) -->
    <line x1="216" y1="32" x2="216" y2="58" stroke-width="2.5" />
    <line x1="224" y1="32" x2="224" y2="58" stroke-width="2.5" />
    <line x1="224" y1="45" x2="275" y2="45" />
    <line x1="275" y1="45" x2="275" y2="110" />

    <!-- Non-Inverting (+) Input Lead from Vos source -->
    <line x1="165" y1="135" x2="180" y2="135" />
    <!-- Offset Voltage Source Circle: center (145, 135), radius 20 -->
    <circle cx="145" cy="135" r="20" fill="#ffffff" stroke-width="2" />
    <line x1="145" y1="155" x2="145" y2="175" />

    <!-- Ground below Vos Source at (145, 175) -->
    <line x1="133" y1="175" x2="157" y2="175" stroke-width="2.5" />
    <line x1="138" y1="180" x2="152" y2="180" stroke-width="2" />
    <line x1="142" y1="185" x2="148" y2="185" stroke-width="1.5" />

    <!-- Op-Amp Output line and terminal -->
    <line x1="255" y1="110" x2="305" y2="110" />
    <!-- Output terminal dot (open circle) at (309, 110) -->
    <circle cx="309" cy="110" r="3" fill="#ffffff" stroke-width="1.5" />

    <!-- Output ground reference at x=309, y=180 -->
    <line x1="297" y1="180" x2="321" y2="180" stroke-width="2.5" />
    <line x1="302" y1="185" x2="316" y2="185" stroke-width="2" />
    <line x1="306" y1="190" x2="312" y2="190" stroke-width="1.5" />

    <!-- Connection nodes (filled dots) -->
    <circle cx="160" cy="85" r="2.5" fill="#000000" stroke="none" />
    <circle cx="275" cy="110" r="2.5" fill="#000000" stroke="none" />

    <!-- Current Arrows -->
    <!-- Current Vos/R through R (pointing left): above R -->
    <line x1="118" y1="65" x2="82" y2="65" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Current Vos/R through C (pointing left): above feedback path -->
    <line x1="205" y1="28" x2="162" y2="28" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Op-amp input polarity signs & Vos source symbols -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">
    <!-- Op-amp '-' sign -->
    <text x="192" y="91">−</text>
    <!-- Op-amp '+' sign -->
    <text x="192" y="141">+</text>

    <!-- Source Vos polarity marks: '-' on left, '+' on right inside circle -->
    <text x="135" y="141" font-size="16">−</text>
    <text x="155" y="141" font-size="16">+</text>
  </g>

  <!-- Output polarity (+ and -) and variable vo -->
  <g font-family="Times New Roman, serif" fill="#000000" text-anchor="middle">
    <text x="309" y="132" font-size="18" font-weight="bold">+</text>
    <text x="309" y="152" font-size="17" font-style="italic">v<tspan font-size="12" font-style="italic" dy="4">O</tspan></text>
    <text x="309" y="172" font-size="20" font-weight="bold">−</text>
  </g>

  <!-- Annotations & Component Labels -->
  <g font-family="Times New Roman, serif" fill="#000000">
    <!-- Component R -->
    <text x="110" y="60" font-size="16" font-style="italic">R</text>

    <!-- Current above R: Vos / R -->
    <text x="75" y="60" font-size="15" font-style="italic" text-anchor="middle">V<tspan font-size="11" font-style="normal" dy="3">OS</tspan><tspan font-size="15" font-style="normal" dy="-3">/</tspan>R</text>

    <!-- Node voltage label Vos below the node / above op-amp inverting lead -->
    <text x="170" y="102" font-size="15" font-style="italic" text-anchor="middle">V<tspan font-size="11" font-style="normal" dy="3">OS</tspan></text>

    <!-- Component C -->
    <text x="228" y="24" font-size="16" font-style="italic">C</text>

    <!-- Current above C: Vos / R -->
    <text x="182" y="22" font-size="15" font-style="italic" text-anchor="middle">V<tspan font-size="11" font-style="normal" dy="3">OS</tspan><tspan font-size="15" font-style="normal" dy="-3">/</tspan>R</text>

    <!-- Source Vos label below source circle -->
    <text x="145" y="169" font-size="15" font-style="italic" text-anchor="middle">V<tspan font-size="11" font-style="normal" dy="3">OS</tspan></text>
  </g>

  <!-- Output Equation Block on the Right -->
  <g font-family="Times New Roman, serif" font-size="16" fill="#000000">
    <!-- Line 1: vo = Vos + (1/C) \int_0^t (Vos/R) dt -->
    <g transform="translate(335, 102)">
      <text x="0" y="0" font-style="italic">v<tspan font-size="12" font-style="italic" dy="4">O</tspan></text>
      <text x="24" y="0">=</text>
      <text x="44" y="0" font-style="italic">V<tspan font-size="12" font-style="normal" dy="4">OS</tspan></text>
      <text x="74" y="0">+</text>
      
      <!-- Fraction 1 / C -->
      <text x="93" y="-8" font-size="13">1</text>
      <line x1="90" y1="-5" x2="104" y2="-5" stroke="#000000" stroke-width="1.2" />
      <text x="92" y="10" font-size="14" font-style="italic">C</text>

      <!-- Integral symbol from 0 to t -->
      <text x="109" y="3" font-size="25" font-weight="300">∫</text>
      <text x="120" y="-9" font-size="10" font-style="italic">t</text>
      <text x="117" y="13" font-size="10">0</text>

      <!-- Fraction Vos / R inside integral -->
      <text x="133" y="-8" font-size="13" font-style="italic">V<tspan font-size="9" font-style="normal" dy="2">OS</tspan></text>
      <line x1="130" y1="-5" x2="153" y2="-5" stroke="#000000" stroke-width="1.2" />
      <text x="137" y="10" font-size="14" font-style="italic">R</text>

      <!-- dt -->
      <text x="158" y="0" font-style="italic">dt</text>
    </g>

    <!-- Line 2: = Vos + (Vos / CR) t -->
    <g transform="translate(335, 142)">
      <text x="24" y="0">=</text>
      <text x="44" y="0" font-style="italic">V<tspan font-size="12" font-style="normal" dy="4">OS</tspan></text>
      <text x="74" y="0">+</text>

      <!-- Fraction Vos / CR -->
      <text x="96" y="-8" font-size="13" font-style="italic">V<tspan font-size="9" font-style="normal" dy="2">OS</tspan></text>
      <line x1="90" y1="-5" x2="120" y2="-5" stroke="#000000" stroke-width="1.2" />
      <text x="95" y="10" font-size="14" font-style="italic">CR</text>

      <!-- t -->
      <text x="126" y="0" font-style="italic">t</text>
    </g>
  </g>
</svg>
