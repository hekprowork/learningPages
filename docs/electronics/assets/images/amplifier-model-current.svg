<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Current amplifier two-port model</title>
  <desc id="desc">Textbook-style current amplifier model with input resistance, current-controlled current source, and output resistance.</desc>
  <defs>
    <pattern id="shade" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <rect width="9" height="9" fill="#f5f5f5"/>
      <path d="M0 0V9" stroke="#dedede" stroke-width="1"/>
    </pattern>
    <style>
      .wire{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .math{fill:#111;font:italic 22px "Times New Roman",Georgia,serif}
      .small{fill:#111;font:italic 19px "Times New Roman",Georgia,serif}
      .port{fill:#fff;stroke:#111;stroke-width:3}
    </style>
  </defs>
  <rect width="760" height="330" fill="#fff"/>
  <rect x="112" y="42" width="548" height="220" fill="url(#shade)"/>
  <circle class="port" cx="82" cy="105" r="6"/><circle class="port" cx="82" cy="225" r="6"/>
  <circle class="port" cx="678" cy="105" r="6"/><circle class="port" cx="678" cy="225" r="6"/>
  <path class="wire" d="M88 105H205M88 225H678"/>
  <path class="wire" d="M205 105V120l10 10 10-20 10 20 10-20 10 20 10-10v105"/>
  <path class="wire" d="M440 125V105H678M440 205V225"/>
  <path class="wire" d="M440 125L410 165 440 205 470 165Z"/>
  <path class="wire" d="M570 105V120l10 10 10-20 10 20 10-20 10 20 10-10v105"/>
  <path class="thin" d="M440 190v-48M432 150l8-8 8 8"/>
  <path class="thin" d="M120 105h32M144 99l8 6-8 6"/>
  <path class="thin" d="M616 105h32M640 99l8 6-8 6"/>
  <path class="thin" d="M700 132v24M694 144h12M694 186h12"/>
  <path class="thin" d="M380 225v18m-16 0h32m-26 6h20m-14 6h8"/>
  <text class="math" x="112" y="92">i<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text class="small" x="244" y="166">R<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text class="small" x="472" y="166">A<tspan baseline-shift="sub" font-size="70%">is</tspan>i<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text class="small" x="602" y="166">R<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
  <text class="math" x="700" y="169">v<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
  <text class="math" x="650" y="92">i<tspan baseline-shift="sub" font-size="70%">o</tspan></text>
</svg>
